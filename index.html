<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linien-Modell</title>
<style>
  :root { --ink:#0f172a; --grau:#64748b; --linie:#cbd5e1; --papier:#f1f5f9;
          --rot:#9f1239; --gruen:#0f766e; --gelb:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papier); color:var(--ink);
         font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  .huelle { max-width:640px; margin:0 auto; background:#fff; min-height:100vh; }
  header { background:var(--ink); color:#f1f5f9; padding:16px; }
  header .oben { font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--gelb); }
  header h1 { margin:2px 0 0; font-size:24px; letter-spacing:-.02em; }
  header p { margin:4px 0 0; font-size:12px; color:#94a3b8; }
  .block { padding:16px; border-bottom:1px solid var(--linie); }
  label { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
          color:var(--grau); margin-bottom:4px; }
  select, input { width:100%; padding:9px; border:1px solid var(--linie);
          background:#fff; font-size:15px; font-family:inherit; color:var(--ink); }
  button { width:100%; padding:10px; border:1px solid var(--ink); background:#fff;
           font-family:inherit; font-size:14px; cursor:pointer; }
  button.voll { background:var(--ink); color:#fff; }
  .zwei { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .feld { margin-bottom:12px; }
  .schalter { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--grau); }
  .schalter input { width:auto; }
  .karte { border:1px solid var(--linie); margin:0 16px 14px; }
  .kopf { display:flex; justify-content:space-between; align-items:baseline;
          padding:10px 12px; background:#f8fafc; border-bottom:1px solid var(--linie); }
  .kopf b { font-size:15px; }
  .erw { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .erw span { font-size:11px; font-weight:400; color:var(--grau);
              letter-spacing:.1em; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--grau);
       font-weight:500; text-align:right; padding:6px 12px; }
  th:first-child { text-align:left; }
  td { padding:8px 12px; text-align:right; font-variant-numeric:tabular-nums;
       border-top:1px solid #e2e8f0; }
  td:first-child { text-align:left; font-weight:700; }
  .q { color:var(--grau); font-size:13px; }
  .mitte { background:#fffbeb; }
  .detail { padding:8px 12px; font-size:11px; color:var(--grau); border-top:1px solid #e2e8f0;
            line-height:1.6; }
  .hinweis { padding:16px; font-size:12px; color:var(--grau); line-height:1.6; }
  .warn { margin:0 16px 14px; padding:10px 12px; border:1px solid var(--rot);
          color:var(--rot); font-size:13px; line-height:1.5; }
  .guete { padding:8px 12px; font-size:11px; line-height:1.6; border-top:1px solid #e2e8f0; }
  .guete b { display:block; letter-spacing:.1em; text-transform:uppercase; font-size:10px;
             margin-bottom:2px; }
  .mittel { background:#fffbeb; color:#92400e; }
  details { border-top:1px solid var(--linie); }
  summary { padding:9px 12px; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
            color:var(--grau); cursor:pointer; }
  .teamzeile { padding:6px 12px 0; font-size:12px; font-weight:700; }
  .mini td, .mini th { padding:5px 12px; font-size:13px; }
  .ja { color:var(--gruen); font-weight:700; }
  .nein { color:var(--rot); font-weight:700; }
  .trenner { padding:8px 12px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
             color:var(--grau); background:#f8fafc; border-top:1px solid var(--linie); }
  .spiel { padding:10px 12px; border-top:1px solid #e2e8f0; cursor:pointer; }
  .spiel:hover { background:#f8fafc; }
  .spiel .zeit { font-size:11px; color:var(--grau); letter-spacing:.06em; }
  .spiel .paar { font-weight:700; font-size:14px; margin:1px 0 3px; }
  .spiel .zahlen { font-size:12px; color:var(--grau); font-variant-numeric:tabular-nums; }
  .spiel .werfer { font-size:11px; color:var(--grau); margin-top:2px; }
  .kante { display:inline-block; margin-top:4px; padding:2px 6px; font-size:11px;
           border:1px solid var(--gruen); color:var(--gruen); font-weight:700; }
  .tagkopf { padding:7px 12px; background:#f1f5f9; font-size:11px; font-weight:700;
             letter-spacing:.1em; text-transform:uppercase; color:var(--grau);
             border-top:1px solid var(--linie); }
  code { background:#f1f5f9; padding:1px 4px; font-size:11px; word-break:break-all; }
  .fund { padding:9px 12px; border-top:1px solid #e2e8f0; cursor:pointer; display:flex;
          justify-content:space-between; gap:10px; align-items:flex-start; }
  .fund:hover { background:#f8fafc; }
  .fund .links { min-width:0; }
  .fund .liga { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--grau); }
  .fund .partie { font-size:13px; font-weight:700; }
  .fund .markt { font-size:12px; color:var(--grau); }
  .fund .rechts { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .fund .proz { font-size:16px; font-weight:700; }
  .fund .vorteil { font-size:11px; font-weight:700; color:var(--gruen); }
  .fund .kein { font-size:11px; color:var(--grau); }
  .minute { display:inline-block; padding:1px 6px; background:var(--gruen); color:#fff;
            font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; }
</style>
</head>

<script>
// ======== Einstellungen ========
const SAISONS=["2425","2526","2627"];
const SAISONABSCHLAG=0.8, KAPPA=4, ITER=40;
const KANTE_MIN=0.04, MAX_FUNDE=150;
const QUELLZONE="Europe/London", LIVE_FENSTER=125;

const LIGEN={
  D1:"Bundesliga", D2:"2. Bundesliga",
  E0:"Premier League", E1:"Championship", E2:"League One", E3:"League Two",
  EC:"National League", SP1:"La Liga", SP2:"La Liga 2",
  I1:"Serie A", I2:"Serie B", F1:"Ligue 1", F2:"Ligue 2",
  N1:"Eredivisie", B1:"Jupiler Pro League", P1:"Liga Portugal",
  T1:"Süper Lig", G1:"Super League Griechenland",
  SC0:"Premiership (Schottland)", SC1:"Championship (Schottland)",
  SC2:"League One (Schottland)", SC3:"League Two (Schottland)"
};
const METRIKEN=[
  {id:"tore",name:"Tore",halbwert:300,ref:false,leiter:[0.5,1.5,2.5,3.5,4.5],
   h:r=>z(r.FTHG),a:r=>z(r.FTAG)},
  {id:"ecken",name:"Ecken",halbwert:500,ref:false,
   leiter:[7.5,8.5,9.5,10.5,11.5,12.5,13.5],h:r=>z(r.HC),a:r=>z(r.AC)},
  {id:"karten",name:"Karten",halbwert:200,ref:true,
   leiter:[1.5,2.5,3.5,4.5,5.5,6.5,7.5],
   h:r=>z(r.HY)+z(r.HR),a:r=>z(r.AY)+z(r.AR)},
  {id:"sch",name:"Schüsse",halbwert:500,ref:false,
   leiter:[17.5,19.5,21.5,23.5,25.5,27.5,29.5],h:r=>z(r.HS),a:r=>z(r.AS)},
  {id:"sot",name:"Schüsse aufs Tor",halbwert:450,ref:false,
   leiter:[5.5,6.5,7.5,8.5,9.5,10.5,11.5],h:r=>z(r.HST),a:r=>z(r.AST)}
];
const QUOTEN={
  "Heimsieg":["AvgH","B365H","PSH","BWH","MaxH"],
  "Unentschieden":["AvgD","B365D","PSD","BWD","MaxD"],
  "Auswärtssieg":["AvgA","B365A","PSA","BWA","MaxA"],
  "Tore über 2,5":["Avg>2.5","B365>2.5","P>2.5","Max>2.5"],
  "Tore unter 2,5":["Avg<2.5","B365<2.5","P<2.5","Max<2.5"]
};
const MLB_HALBWERT=240, MLB_KAPPA=6, MLB_KAPPA_IP=50, MLB_ITER=30;
const SAISONGEWICHT=[1,0.6,0.35];
const K_KAPPA_BF=300;   // Dämpfung der Strikeout-Rate, in Battern
const K_KAPPA_ST=4;     // Dämpfung der erwarteten Batters Faced, in Starts
const K_KAPPA_PA=3000;  // Dämpfung der Offensivwerte, in Plate Appearances

// ======== Hilfsmittel ========
function z(v){ if(v===undefined||v===null||String(v).trim()==="") return NaN;
               const x=Number(v); return Number.isFinite(x)?x:NaN; }
const f=(v,n=2)=>Number.isFinite(v)
  ? v.toLocaleString("de-DE",{minimumFractionDigits:n,maximumFractionDigits:n}):"–";
const saisonText=s=>"20"+s.slice(0,2)+"/"+s.slice(2);
const TAGE=["So","Mo","Di","Mi","Do","Fr","Sa"];
const warte=()=>new Promise(r=>setTimeout(r,0));
const zwei=n=>String(n).padStart(2,"0");

function zeileTeilen(l){
  const out=[]; let cur="",q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===","&&!q){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur); return out;
}
function csvLesen(text){
  const zeilen=text.replace(/^\uFEFF/,"").replace(/\r/g,"")
                   .split("\n").filter(l=>l.trim()!=="");
  if(!zeilen.length) return [];
  const kopf=zeileTeilen(zeilen[0]).map(s=>s.trim());
  return zeilen.slice(1).map(l=>{
    const t=zeileTeilen(l),o={};
    kopf.forEach((k,i)=>o[k]=(t[i]||"").trim());
    return o;
  });
}
function datum(s){
  if(!s) return null;
  const t=String(s).trim().split("/");
  if(t.length!==3) return null;
  let j=Number(t[2]); if(j<100) j+=2000;
  const d=new Date(Date.UTC(j,Number(t[1])-1,Number(t[0])));
  return isNaN(d.getTime())?null:d;
}
const ZONENFORMAT=new Intl.DateTimeFormat("en-GB",{timeZone:QUELLZONE,hour12:false,
  year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
function zonenversatz(ms){
  const p={};
  ZONENFORMAT.formatToParts(new Date(ms)).forEach(x=>{p[x.type]=x.value;});
  return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)-ms)/60000;
}
const hatZeit=r=>String(r.Time||"").includes(":");
function anstoss(r){
  const d=datum(r.Date);
  if(!d) return Infinity;
  if(!hatZeit(r)) return d.getTime()+86340000;
  const t=String(r.Time).trim().split(":");
  const roh=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),
                     Number(t[0])||0,Number(t[1])||0);
  let ms=roh;
  for(let i=0;i<2;i++) ms=roh-zonenversatz(ms)*60000;
  return ms;
}
function zeitText(r){
  const ms=anstoss(r);
  if(!isFinite(ms)||!hatZeit(r)) return "";
  const d=new Date(ms); return zwei(d.getHours())+":"+zwei(d.getMinutes());
}
function tagText(r){
  const ms=anstoss(r);
  const d=isFinite(ms)?new Date(ms):datum(r.Date);
  return TAGE[d.getDay()]+" "+zwei(d.getDate())+"."+zwei(d.getMonth()+1)+".";
}
const tagVonMs=ms=>{const d=new Date(ms);
  return TAGE[d.getDay()]+" "+zwei(d.getDate())+"."+zwei(d.getMonth()+1)+".";};
const zeitVonMs=ms=>{const d=new Date(ms);
  return zwei(d.getHours())+":"+zwei(d.getMinutes());};
const saisonIndex=d=>d.getUTCFullYear()-(d.getUTCMonth()<6?1:0);
const HEUTE=new Date(), JETZT=HEUTE.getTime(), SAISON_JETZT=saisonIndex(HEUTE);

function gewicht(r,halbwert,bezugMs,bezugSaison){
  const d=datum(r.Date);
  if(!d) return 0.25;
  const tage=Math.max(0,(bezugMs-d.getTime())/86400000);
  return Math.pow(0.5,tage/halbwert)
       * Math.pow(SAISONABSCHLAG,Math.max(0,bezugSaison-saisonIndex(d)));
}
function lnGamma(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,
           -176.61502916214059,12.507343278686905,-0.13857109526572012,
           9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lnGamma(1-x);
  x-=1; let a=0.99999999999980993;
  for(let i=0;i<g.length;i++) a+=g[i]/(x+i+1);
  const t=x+g.length-0.5;
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function verteilung(mu,phi,max){
  const p=[];
  if(phi<=1.02){
    for(let k=0;k<=max;k++) p.push(Math.exp(-mu+k*Math.log(mu)-lnGamma(k+1)));
  } else {
    const r=mu/(phi-1);
    for(let k=0;k<=max;k++)
      p.push(Math.exp(lnGamma(k+r)-lnGamma(r)-lnGamma(k+1)
             +r*Math.log(r/(r+mu))+k*Math.log(mu/(r+mu))));
  }
  return p;
}
function summenkurve(mu,phi,max){
  const p=verteilung(mu,phi,max); const cdf=[]; let s=0;
  p.forEach(x=>{s+=x;cdf.push(s);}); return cdf;
}
function pOver(mu,phi,L){
  if(!(mu>0)) return 0.5;
  const k=Math.floor(L);
  const cdf=summenkurve(mu,phi,Math.max(k+1,Math.ceil(mu*3+30)));
  return Math.min(0.999,Math.max(0.001,1-cdf[k]));
}
const daempfen=(v,n,k)=>(!Number.isFinite(v)||n<=0)?1:1+(v-1)*(n/(n+k));
function linienFuer(mu,phi){
  if(!(mu>0)) return [];
  const cdf=summenkurve(mu,phi,Math.ceil(mu*3+30));
  let best=0,ab=9;
  for(let k=0;k<cdf.length-1;k++){
    const d=Math.abs((1-cdf[k])-0.5);
    if(d<ab){ab=d;best=k;}
  }
  const out=[];
  for(let k=Math.max(0,best-1);k<=best+1;k++){
    const over=1-cdf[k];
    if(over<0.002||over>0.998) continue;
    out.push({L:k+0.5,over,under:1-over,mitte:k===best});
  }
  return out;
}
function linienLeiter(mu,phi,leiter){
  if(!(mu>0)) return [];
  const max=Math.max(Math.ceil(mu*3+30),Math.ceil(leiter[leiter.length-1])+2);
  const cdf=summenkurve(mu,phi,max);
  return leiter.map(L=>({L,over:1-cdf[Math.floor(L)],under:cdf[Math.floor(L)]}))
               .filter(x=>x.over>0.005&&x.over<0.995);
}
function tau(x,y,lh,la,rho){
  if(x===0&&y===0) return 1-lh*la*rho;
  if(x===0&&y===1) return 1+lh*rho;
  if(x===1&&y===0) return 1+la*rho;
  if(x===1&&y===1) return 1-rho;
  return 1;
}
function schaetzeRho(sp,hf,af,staerken,gew){
  let best=0,bestLL=-Infinity;
  for(let rho=-0.20;rho<=0.2001;rho+=0.01){
    let ll=0,ok=true;
    for(const r of sp){
      const x=hf(r),y=af(r);
      if(x>1||y>1) continue;
      const s=staerken(r), t=tau(x,y,s.muH,s.muA,rho);
      if(!(t>0)){ok=false;break;}
      ll+=gew(r)*Math.log(t);
    }
    if(ok&&ll>bestLL){bestLL=ll;best=rho;}
  }
  return best;
}
function spielausgang(muH,muA,phiH,phiA,rho,N){
  N=N||12;
  const pH=verteilung(muH,phiH,N),pA=verteilung(muA,phiA,N);
  const g=[]; let summe=0;
  for(let x=0;x<=N;x++){
    g[x]=[];
    for(let y=0;y<=N;y++){
      const v=pH[x]*pA[y]*tau(x,y,muH,muA,rho);
      g[x][y]=Math.max(0,v); summe+=g[x][y];
    }
  }
  let heim=0,remis=0,aus=0,btts=0;
  for(let x=0;x<=N;x++) for(let y=0;y<=N;y++){
    const p=g[x][y]/summe;
    if(x>y) heim+=p; else if(x===y) remis+=p; else aus+=p;
    if(x>=1&&y>=1) btts+=p;
  }
  return {heim,remis,aus,bttsJa:btts,bttsNein:1-btts};
}

const DATEN={}, MODELLE={};
let ANSETZUNGEN=[], FIXSTATUS="", AKTIV="", SPORT="fussball";
const rohdaten=()=>AKTIV&&DATEN[AKTIV]?DATEN[AKTIV].alle:[];
const aktuelle=()=>AKTIV&&DATEN[AKTIV]?DATEN[AKTIV].aktuelle:[];

// ======== Fußballmodell ========
function staerkenEinfach(sp,m,g,mitte,hvH,hvA){
  const T={};
  const hol=t=>T[t]=T[t]||{fuer:0,gegen:0,basF:0,basG:0,n:0,roh:0};
  sp.forEach(r=>{
    const w=g(r),eH=mitte*hvH,eA=mitte*hvA;
    const h=hol(r.HomeTeam),a=hol(r.AwayTeam);
    h.fuer+=w*m.h(r); h.basF+=w*eH; h.gegen+=w*m.a(r); h.basG+=w*eA; h.n+=w; h.roh++;
    a.fuer+=w*m.a(r); a.basF+=w*eA; a.gegen+=w*m.h(r); a.basG+=w*eH; a.n+=w; a.roh++;
  });
  const att={},def={};
  Object.keys(T).forEach(t=>{
    const x=T[t];
    att[t]=x.basF>0?daempfen(x.fuer/x.basF,x.n,KAPPA):1;
    def[t]=x.basG>0?daempfen(x.gegen/x.basG,x.n,KAPPA):1;
  });
  return {att,def,hvH,hvA,T};
}
function staerkenRegression(sp,m,g,mitte,hvH0,hvA0){
  const T={};
  const hol=t=>T[t]=T[t]||{n:0,roh:0};
  sp.forEach(r=>{
    const w=g(r);
    hol(r.HomeTeam).n+=w; T[r.HomeTeam].roh++;
    hol(r.AwayTeam).n+=w; T[r.AwayTeam].roh++;
  });
  const teams=Object.keys(T),att={},def={};
  teams.forEach(t=>{att[t]=1;def[t]=1;});
  let hvH=hvH0,hvA=hvA0;
  const K=KAPPA*mitte;
  for(let it=0;it<ITER;it++){
    const an={},ad={},bn={},bd={};
    teams.forEach(t=>{an[t]=0;ad[t]=0;bn[t]=0;bd[t]=0;});
    sp.forEach(r=>{
      const w=g(r),H=r.HomeTeam,A=r.AwayTeam,yH=m.h(r),yA=m.a(r);
      an[H]+=w*yH; ad[H]+=w*mitte*hvH*def[A];
      an[A]+=w*yA; ad[A]+=w*mitte*hvA*def[H];
      bn[A]+=w*yH; bd[A]+=w*mitte*hvH*att[H];
      bn[H]+=w*yA; bd[H]+=w*mitte*hvA*att[A];
    });
    teams.forEach(t=>{att[t]=(an[t]+K)/(ad[t]+K); def[t]=(bn[t]+K)/(bd[t]+K);});
    let sa=0,sd=0; teams.forEach(t=>{sa+=att[t];sd+=def[t];});
    const ca=sa/teams.length,cd=sd/teams.length;
    if(ca>0&&cd>0) teams.forEach(t=>{att[t]/=ca;def[t]/=cd;});
    let nH=0,dH=0,nA=0,dA=0;
    sp.forEach(r=>{
      const w=g(r);
      nH+=w*m.h(r); dH+=w*mitte*att[r.HomeTeam]*def[r.AwayTeam];
      nA+=w*m.a(r); dA+=w*mitte*att[r.AwayTeam]*def[r.HomeTeam];
    });
    if(dH>0) hvH=nH/dH;
    if(dA>0) hvA=nA/dA;
  }
  return {att,def,hvH,hvA,T};
}
function modellBauen(rows,m,verfahren,bezugMs,bezugSaison){
  const sp=rows.filter(r=>r.HomeTeam&&r.AwayTeam
           &&Number.isFinite(m.h(r))&&Number.isFinite(m.a(r)));
  if(sp.length<20) return null;
  const bm=bezugMs===undefined?JETZT:bezugMs;
  const bs=bezugSaison===undefined?SAISON_JETZT:bezugSaison;
  const g=r=>gewicht(r,m.halbwert,bm,bs);
  let gs=0,sH=0,sA=0;
  sp.forEach(r=>{const w=g(r); gs+=w; sH+=w*m.h(r); sA+=w*m.a(r);});
  if(!(gs>0)) return null;
  const ligaH=sH/gs,ligaA=sA/gs,mitte=(ligaH+ligaA)/2;
  if(!(mitte>0)) return null;
  const S=verfahren==="regression"
    ? staerkenRegression(sp,m,g,mitte,ligaH/mitte,ligaA/mitte)
    : staerkenEinfach(sp,m,g,mitte,ligaH/mitte,ligaA/mitte);
  const A=t=>S.att[t]!==undefined?S.att[t]:1;
  const D=t=>S.def[t]!==undefined?S.def[t]:1;
  const staerken=(heim,gast)=>({
    muH:mitte*S.hvH*A(heim)*D(gast), muA:mitte*S.hvA*A(gast)*D(heim)});
  let n=0,rH=0,rA=0,rT=0;
  sp.forEach(r=>{
    const s=staerken(r.HomeTeam,r.AwayTeam);
    if(!(s.muH>0)||!(s.muA>0)) return;
    n++;
    rH+=(m.h(r)-s.muH)**2/s.muH; rA+=(m.a(r)-s.muA)**2/s.muA;
    const t=s.muH+s.muA;
    rT+=((m.h(r)+m.a(r))-t)**2/t;
  });
  const ligaMittel=sp.reduce((s,r)=>s+m.h(r)+m.a(r),0)/sp.length;
  const R={};
  if(m.ref) sp.forEach(r=>{
    const nm=(r.Referee||"").trim(); if(!nm) return;
    const w=g(r);
    R[nm]=R[nm]||{s:0,n:0}; R[nm].s+=w*(m.h(r)+m.a(r)); R[nm].n+=w;
  });
  const mo={T:S.T,staerken,angriff:A,abwehr:D,hvH:S.hvH,mitte,
            phiH:n?rH/n:1,phiA:n?rA/n:1,phiT:n?rT/n:1,
            ligaMittel,spiele:sp.length,R,rho:0};
  if(m.id==="tore") mo.rho=schaetzeRho(sp,m.h,m.a,r=>staerken(r.HomeTeam,r.AwayTeam),g);
  return mo;
}
function holModell(code,m,verf){
  const k=code+":"+verf+":"+m.id;
  if(MODELLE[k]===undefined) MODELLE[k]=modellBauen(DATEN[code].alle,m,verf);
  return MODELLE[k];
}
function rechnen(mo,heim,gast,ref){
  let {muH,muA}=mo.staerken(heim,gast);
  let rf=1;
  if(ref&&mo.R[ref]&&mo.R[ref].n>0){
    rf=daempfen((mo.R[ref].s/mo.R[ref].n)/(mo.mitte*2),mo.R[ref].n,8);
    muH*=rf; muA*=rf;
  }
  const leer={n:0,roh:0},h=mo.T[heim]||leer,a=mo.T[gast]||leer;
  return {muH,muA,mu:muH+muA,rf,
    angH:mo.angriff(heim),abwH:mo.abwehr(heim),
    angA:mo.angriff(gast),abwA:mo.abwehr(gast),
    gesamt:linienFuer(muH+muA,mo.phiT),
    heimL:linienFuer(muH,mo.phiH),gastL:linienFuer(muA,mo.phiA),
    hGew:h.n,aGew:a.n,hRoh:h.roh,aRoh:a.roh};
}

// ======== Baseball ========
const MLB={spiele:[],pitcher:{},starts:[],teams:{},ansetzungen:[],
           geladen:false,modelle:{},kModell:null};
const mlbTage=iso=>{const d=new Date(String(iso).slice(0,10)+"T12:00:00Z");
  return isNaN(d.getTime())?9999:Math.max(0,(JETZT-d.getTime())/86400000);};
const mlbGewicht=s=>Math.pow(0.5,mlbTage(s.datum)/MLB_HALBWERT);

async function mlbLaden(){
  if(MLB.geladen) return true;
  const setz=t=>{document.getElementById("mlbStatus").innerHTML=t;};
  setz("Lade …");
  try{
    const [rs,rp,ra,rst,rt]=await Promise.all([
      fetch("./daten/mlb-spiele.csv"), fetch("./daten/mlb-pitcher.csv"),
      fetch("./daten/mlb-ansetzungen.csv"), fetch("./daten/mlb-starts.csv"),
      fetch("./daten/mlb-teams.csv")]);
    if(!rs.ok){setz("daten/mlb-spiele.csv fehlt.");return false;}
    MLB.spiele=csvLesen(await rs.text()).map(r=>({
      datum:r.Datum,park:r.Park,heim:r.Heim,gast:r.Gast,
      F5H:z(r.HeimF5),F5A:z(r.GastF5),I1H:z(r.HeimI1),I1A:z(r.GastI1),
      RH:z(r.HeimR),RA:z(r.GastR),
      LH:z(r.HeimR)-z(r.HeimF5),LA:z(r.GastR)-z(r.GastF5),
      hp:r.HeimStarterId,ap:r.GastStarterId,hpn:r.HeimStarter,apn:r.GastStarter
    })).filter(s=>s.heim&&s.gast&&Number.isFinite(s.F5H)&&Number.isFinite(s.F5A));
    if(rp.ok){
      const roh=csvLesen(await rp.text());
      const jahre=[...new Set(roh.map(p=>Number(p.Saison)))].sort((a,b)=>b-a);
      roh.forEach(p=>{
        const rang=jahre.indexOf(Number(p.Saison));
        const w=SAISONGEWICHT[rang]!==undefined?SAISONGEWICHT[rang]:0.2;
        const id=String(p.Id);
        const x=MLB.pitcher[id]=MLB.pitcher[id]||
          {name:p.Name,IP:0,R:0,ER:0,SO:0,BB:0,HBP:0,HR:0,BF:0,GS:0};
        x.name=p.Name||x.name;
        x.IP+=w*(z(p.IP)||0); x.R+=w*(z(p.R)||0); x.ER+=w*(z(p.ER)||0);
        x.SO+=w*(z(p.SO)||0); x.BB+=w*(z(p.BB)||0);
        x.HBP+=w*(z(p.HBP)||0); x.HR+=w*(z(p.HR)||0);
        x.BF+=w*(z(p.BF)||0); x.GS+=w*(z(p.GS)||0);
      });
    }
    if(rst.ok) MLB.starts=csvLesen(await rst.text()).map(r=>({
      datum:r.Datum, pid:String(r.PitcherId), gegner:r.Gegner,
      BF:z(r.BF), SO:z(r.SO), IP:z(r.IP)
    })).filter(s=>s.pid&&Number.isFinite(s.BF)&&s.BF>0&&Number.isFinite(s.SO));
    if(rt.ok){
      const roh=csvLesen(await rt.text());
      const jahre=[...new Set(roh.map(p=>Number(p.Saison)))].sort((a,b)=>b-a);
      roh.forEach(t=>{
        const rang=jahre.indexOf(Number(t.Saison));
        const w=SAISONGEWICHT[rang]!==undefined?SAISONGEWICHT[rang]:0.2;
        const x=MLB.teams[t.Team]=MLB.teams[t.Team]||{PA:0,SO:0};
        x.PA+=w*(z(t.PA)||0); x.SO+=w*(z(t.SO)||0);
      });
    }
    if(ra.ok) MLB.ansetzungen=csvLesen(await ra.text()).map(r=>({
      ms:Date.parse(r.Zeit),park:r.Park,heim:r.Heim,gast:r.Gast,
      hp:r.HeimStarterId,hpn:r.HeimStarter,ap:r.GastStarterId,apn:r.GastStarter
    })).filter(r=>r.heim&&r.gast&&Number.isFinite(r.ms));
    MLB.geladen=true;
    setz(`${MLB.spiele.length} Spiele, ${Object.keys(MLB.pitcher).length} Pitcher, `+
         `${MLB.starts.length} Startprotokolle, ${MLB.ansetzungen.length} Ansetzungen.`);
    return true;
  }catch(e){setz("MLB-Daten konnten nicht geladen werden.");return false;}
}

// --- Strikeout-Modell ---
function kModell(){
  if(MLB.kModell!==null) return MLB.kModell;
  if(MLB.starts.length<200){ MLB.kModell=false; return false; }
  const g=s=>Math.pow(0.5,mlbTage(s.datum)/MLB_HALBWERT);

  // Offensiven: wie oft schlaegt das Team ins Leere
  let PA=0,SO=0;
  Object.values(MLB.teams).forEach(t=>{PA+=t.PA;SO+=t.SO;});
  const lgHit=PA>0?SO/PA:0.22;
  const teamF={};
  Object.entries(MLB.teams).forEach(([n,t])=>{
    teamF[n]=t.PA>0?daempfen((t.SO/t.PA)/lgHit,t.PA,K_KAPPA_PA):1;
  });
  const TF=n=>teamF[n]!==undefined?teamF[n]:1;

  // Ligarate und erwartete Batters Faced je Start
  let wSO=0,wBF=0,wN=0,wBFs=0;
  MLB.starts.forEach(s=>{const w=g(s); wSO+=w*s.SO; wBF+=w*s.BF; wN+=w; wBFs+=w*s.BF;});
  const lgRate=wBF>0?wSO/wBF:0.22;
  const lgBF=wN>0?wBFs/wN:22;

  // Strikeout-Rate je Werfer, bereinigt um die Gegneroffensive
  const num={},den={},bfSum={},nSum={};
  MLB.starts.forEach(s=>{
    const w=g(s);
    num[s.pid]=(num[s.pid]||0)+w*s.SO;
    den[s.pid]=(den[s.pid]||0)+w*s.BF*lgRate*TF(s.gegner);
    bfSum[s.pid]=(bfSum[s.pid]||0)+w*s.BF;
    nSum[s.pid]=(nSum[s.pid]||0)+w;
  });
  const K=lgRate*K_KAPPA_BF;
  const pitF={}, bfErw={};
  Object.keys(num).forEach(p=>{
    pitF[p]=(num[p]+K)/(den[p]+K);
    bfErw[p]=(bfSum[p]+K_KAPPA_ST*lgBF)/(nSum[p]+K_KAPPA_ST);
  });

  // Erwartung vor dem Start, danach Streuung aus den Abweichungen.
  // Bewusst mit der erwarteten statt der tatsaechlichen Batterzahl, damit
  // die Unsicherheit ueber die Einsatzdauer in der Streuung landet.
  const erwarte=(pid,gegner)=>{
    const p=String(pid);
    let faktor=pitF[p], bf=bfErw[p];
    if(faktor===undefined){
      const s=MLB.pitcher[p];
      if(s&&s.BF>20){
        faktor=daempfen((s.SO/s.BF)/lgRate,s.BF,K_KAPPA_BF);
        bf=s.GS>0?(s.BF+K_KAPPA_ST*lgBF*1)/(s.GS+K_KAPPA_ST):lgBF;
      } else { faktor=1; bf=lgBF; }
    }
    return {mu:bf*lgRate*faktor*TF(gegner), bf, faktor};
  };
  let n=0,res=0;
  MLB.starts.forEach(s=>{
    const e=erwarte(s.pid,s.gegner);
    if(!(e.mu>0)) return;
    n++; res+=(s.SO-e.mu)**2/e.mu;
  });
  const phi=n?res/n:1.3;
  MLB.kModell={erwarte,phi,lgRate,lgBF,teamF:TF,starts:MLB.starts.length};
  return MLB.kModell;
}

function mlbFipFaktoren(){
  let IP=0,HR=0,BB=0,HBP=0,SO=0,ER=0;
  Object.values(MLB.pitcher).forEach(p=>{
    IP+=p.IP;HR+=p.HR;BB+=p.BB;HBP+=p.HBP;SO+=p.SO;ER+=p.ER;});
  if(!(IP>0)) return {};
  const lgERA=9*ER/IP, C=lgERA-(13*HR+3*(BB+HBP)-2*SO)/IP, out={};
  Object.entries(MLB.pitcher).forEach(([id,p])=>{
    if(!(p.IP>3)) return;
    const fip=(13*p.HR+3*(p.BB+p.HBP)-2*p.SO)/p.IP+C;
    out[id]=daempfen(fip/lgERA,p.IP,MLB_KAPPA_IP);
  });
  return out;
}
function mlbBauen(art,pitcherArt){
  // art: F5 = erste fuenf Innings, I1 = erstes Inning, L = ab dem sechsten.
  // Bei L wird nicht dem Starter zugerechnet, sondern dem Bullpen des Teams.
  const bullpen = art==="L";
  const hf=s=>s[art+"H"], af=s=>s[art+"A"];
  const gegenHeim = s => bullpen ? s.gast : s.ap;
  const gegenGast = s => bullpen ? s.heim : s.hp;
  const sp=MLB.spiele.filter(s=>Number.isFinite(hf(s))&&Number.isFinite(af(s))
           &&hf(s)>=0&&af(s)>=0);
  if(sp.length<200) return null;
  const g=mlbGewicht;
  let gs=0,sH=0,sA=0;
  sp.forEach(s=>{const w=g(s); gs+=w; sH+=w*hf(s); sA+=w*af(s);});
  const ligaH=sH/gs,ligaA=sA/gs,liga=(ligaH+ligaA)/2;
  if(!(liga>0)) return null;
  let hvH=ligaH/liga,hvA=ligaA/liga;
  const teams=[...new Set(sp.flatMap(s=>[s.heim,s.gast]))];
  const parks=[...new Set(sp.map(s=>s.park))];
  const werfer=[...new Set(sp.flatMap(s=>[gegenHeim(s),gegenGast(s)]).filter(Boolean))];
  const off={},pit={},park={},nPit={};
  teams.forEach(t=>off[t]=1); parks.forEach(p=>park[p]=1);
  werfer.forEach(p=>{pit[p]=1;nPit[p]=0;});
  sp.forEach(s=>{const w=g(s);
    if(gegenHeim(s)) nPit[gegenHeim(s)]+=w;
    if(gegenGast(s)) nPit[gegenGast(s)]+=w;});
  const fest=(!bullpen&&pitcherArt==="komponenten")?mlbFipFaktoren():null;
  if(fest) werfer.forEach(p=>{pit[p]=fest[p]!==undefined?fest[p]:1;});
  const K=MLB_KAPPA*liga;
  const P=p=>pit[p]!==undefined?pit[p]:1;
  for(let it=0;it<MLB_ITER;it++){
    const on={},od={};
    teams.forEach(t=>{on[t]=0;od[t]=0;});
    sp.forEach(s=>{const w=g(s),pk=park[s.park];
      on[s.heim]+=w*hf(s); od[s.heim]+=w*liga*hvH*P(gegenHeim(s))*pk;
      on[s.gast]+=w*af(s); od[s.gast]+=w*liga*hvA*P(gegenGast(s))*pk;});
    teams.forEach(t=>{off[t]=(on[t]+K)/(od[t]+K);});
    let so=0; teams.forEach(t=>so+=off[t]);
    if(so>0) teams.forEach(t=>off[t]/=so/teams.length);
    if(!fest){
      const pn={},pd={};
      werfer.forEach(p=>{pn[p]=0;pd[p]=0;});
      sp.forEach(s=>{const w=g(s),pk=park[s.park];
        const wh=gegenHeim(s), wg=gegenGast(s);
        if(wh){pn[wh]+=w*hf(s); pd[wh]+=w*liga*hvH*off[s.heim]*pk;}
        if(wg){pn[wg]+=w*af(s); pd[wg]+=w*liga*hvA*off[s.gast]*pk;}});
      werfer.forEach(p=>{pit[p]=(pn[p]+K)/(pd[p]+K);});
      let s2=0; werfer.forEach(p=>s2+=pit[p]);
      if(s2>0) werfer.forEach(p=>pit[p]/=s2/werfer.length);
    }
    const kn={},kd={};
    parks.forEach(p=>{kn[p]=0;kd[p]=0;});
    sp.forEach(s=>{const w=g(s);
      kn[s.park]+=w*(hf(s)+af(s));
      kd[s.park]+=w*liga*(hvH*off[s.heim]*P(gegenHeim(s))
                         +hvA*off[s.gast]*P(gegenGast(s)));});
    parks.forEach(p=>{park[p]=(kn[p]+2*K)/(kd[p]+2*K);});
    let sk=0; parks.forEach(p=>sk+=park[p]);
    if(sk>0) parks.forEach(p=>park[p]/=sk/parks.length);
    let nH=0,dH=0,nA=0,dA=0;
    sp.forEach(s=>{const w=g(s),pk=park[s.park];
      nH+=w*hf(s); dH+=w*liga*off[s.heim]*P(gegenHeim(s))*pk;
      nA+=w*af(s); dA+=w*liga*off[s.gast]*P(gegenGast(s))*pk;});
    if(dH>0) hvH=nH/dH;
    if(dA>0) hvA=nA/dA;
  }
  const erw=(heim,gast,pk,hpid,apid)=>{
    const wh = bullpen ? gast : apid, wg = bullpen ? heim : hpid;
    return {muH:liga*hvH*(off[heim]||1)*P(wh)*(park[pk]||1),
            muA:liga*hvA*(off[gast]||1)*P(wg)*(park[pk]||1)};
  };
  let n=0,rH=0,rA=0,rT=0;
  sp.forEach(s=>{
    const e=erw(s.heim,s.gast,s.park,s.hp,s.ap);
    if(!(e.muH>0)||!(e.muA>0)) return;
    n++;
    rH+=(hf(s)-e.muH)**2/e.muH; rA+=(af(s)-e.muA)**2/e.muA;
    const t=e.muH+e.muA;
    rT+=((hf(s)+af(s))-t)**2/t;
  });
  const mo={art,erw,off,pit,park,hvH,hvA,liga,nPit,bullpen,
    phiH:n?rH/n:1,phiA:n?rA/n:1,phiT:n?rT/n:1,
    spiele:sp.length,komponenten:!!fest,rho:0,
    mittel:sp.reduce((a,s)=>a+hf(s)+af(s),0)/sp.length};
  if(art==="F5"||art==="I1") mo.rho=schaetzeRho(sp,hf,af,
    s=>erw(s.heim,s.gast,s.park,s.hp,s.ap),g);
  return mo;
}
function mlbModell(art,pitcherArt){
  const k=art+":"+pitcherArt;
  if(MLB.modelle[k]===undefined) MLB.modelle[k]=mlbBauen(art,pitcherArt);
  return MLB.modelle[k];
}
// Ganzes Spiel = F5 plus Spaetphase, Streuung an den echten Endstaenden gemessen
function mlbGesamt(pitcherArt){
  const k="GES:"+pitcherArt;
  if(MLB.modelle[k]!==undefined) return MLB.modelle[k];
  const f5=mlbModell("F5",pitcherArt), sp=mlbModell("L",pitcherArt);
  if(!f5||!sp){ MLB.modelle[k]=null; return null; }
  const erw=(heim,gast,pk,hpid,apid)=>{
    const a=f5.erw(heim,gast,pk,hpid,apid), b=sp.erw(heim,gast,pk,hpid,apid);
    return {muH:a.muH+b.muH, muA:a.muA+b.muA,
            f5:a.muH+a.muA, spaet:b.muH+b.muA};
  };
  let n=0,rT=0,rH=0,rA=0;
  MLB.spiele.forEach(s=>{
    if(!Number.isFinite(s.RH)||!Number.isFinite(s.RA)) return;
    const e=erw(s.heim,s.gast,s.park,s.hp,s.ap);
    const t=e.muH+e.muA;
    if(!(t>0)) return;
    n++;
    rT+=((s.RH+s.RA)-t)**2/t;
    rH+=(s.RH-e.muH)**2/e.muH; rA+=(s.RA-e.muA)**2/e.muA;
  });
  const mo={erw, phiT:n?rT/n:1, phiH:n?rH/n:1, phiA:n?rA/n:1,
            bull:sp, spiele:n};
  MLB.modelle[k]=mo;
  return mo;
}
function mlbZeichnen(partie){
  const pa=document.getElementById("pitcherArt").value;
  const ziel=document.getElementById("ergebnis");
  const {heim,gast,park,hp,ap,hpn,apn}=partie;
  const moF5=mlbModell("F5",pa),moI1=mlbModell("I1",pa),moR=mlbGesamt(pa);
  if(!moF5){ziel.innerHTML='<p class="hinweis">Zu wenige Spiele.</p>';return;}
  const e=moF5.erw(heim,gast,park,hp,ap),gesamt=e.muH+e.muA;
  const aus=spielausgang(e.muH,e.muA,moF5.phiH,moF5.phiA,moF5.rho,14);
  const pf=id=>moF5.pit[id]!==undefined?moF5.pit[id]:1;
  const zeile=(n,p)=>`<tr><td>${n}</td><td>${f(p*100,1)} %</td><td class="q">${f(1/p)}</td></tr>`;
  const kopfTab='<table><thead><tr><th>Auswahl</th><th>Wahrsch.</th><th>faire Quote</th></tr></thead><tbody>';
  const linTab=(mu,phi,leiter)=>{
    let t='<table><thead><tr><th>Linie</th><th>Over</th><th>faire Q.</th><th>Under</th><th>faire Q.</th></tr></thead><tbody>';
    linienLeiter(mu,phi,leiter).forEach(l=>{
      t+=`<tr><td>${f(l.L,1)}</td><td>${f(l.over*100,1)} %</td><td class="q">${f(1/l.over)}</td>
        <td>${f(l.under*100,1)} %</td><td class="q">${f(1/l.under)}</td></tr>`;});
    return t+"</tbody></table>";
  };

  let html=`<div class="karte">
    <div class="kopf"><b>F5 · erste fünf Innings</b>
      <div class="erw">${f(gesamt)} <span>Runs erwartet</span></div></div>
    <div class="trenner">Gesamt</div>
    ${linTab(gesamt,moF5.phiT,[3.5,4.5,5.5,6.5,7.5])}
    <div class="trenner">Dreiweg nach fünf Innings</div>
    ${kopfTab}${zeile(heim,aus.heim)}${zeile("Unentschieden",aus.remis)}${zeile(gast,aus.aus)}</tbody></table>
    <details><summary>Team-Totals F5</summary>
      <div class="teamzeile">${heim} · ${f(e.muH)} erwartet</div>
      ${linTab(e.muH,moF5.phiH,[0.5,1.5,2.5,3.5])}
      <div class="teamzeile">${gast} · ${f(e.muA)} erwartet</div>
      ${linTab(e.muA,moF5.phiA,[0.5,1.5,2.5,3.5])}
    </details>
    <div class="detail">
      Offensive ${heim} ${f(moF5.off[heim]||1)} · ${gast} ${f(moF5.off[gast]||1)}<br>
      Werfer ${hpn||"unbekannt"} ${f(pf(hp))} · ${apn||"unbekannt"} ${f(pf(ap))}
      <span class="q">(unter 1,00 besser als Schnitt)</span><br>
      Park ${park||"?"} ${f(moF5.park[park]||1)} · Heimvorteil ${f(moF5.hvH)} ·
      Streuung ${f(moF5.phiT)} · Ligaschnitt ${f(moF5.mittel)} aus ${moF5.spiele} Spielen
    </div></div>`;

  // Strikeouts der beiden Starter
  const km=kModell();
  if(km){
    const eH=km.erwarte(hp,gast), eA=km.erwarte(ap,heim);
    const block=(name,ew,gegner)=>`
      <div class="teamzeile">${name||"Starter offen"} gegen ${gegner} ·
        ${f(ew.mu,2)} erwartet</div>
      ${linTab(ew.mu,km.phi,[3.5,4.5,5.5,6.5,7.5,8.5,9.5])}
      <div class="detail">Erwartete Batters Faced ${f(ew.bf,1)} ·
        Strikeout-Faktor ${f(ew.faktor)} ·
        Gegner-Anfälligkeit ${f(km.teamF(gegner))}</div>`;
    html+=`<div class="karte">
      <div class="kopf"><b>Strikeouts der Starter</b>
        <div class="erw">${f(eH.mu,1)} / ${f(eA.mu,1)} <span>erwartet</span></div></div>
      ${block(hpn,eH,gast)}
      ${block(apn,eA,heim)}
      <div class="guete mittel"><b>Belastbarkeit: mittel</b>
        Die Rate trifft das Modell gut, die Einsatzdauer nicht. Ob ein Werfer sechs
        Innings durchgeht oder nach dreien nach einem schlechten Inning herausgenommen
        wird, entscheidet über jede Over-Wette — und das hängt am Spielstand, am
        Zustand des Bullpens und an der Pitch Count, nicht an der Strikeout-Fähigkeit.
        Diese Unsicherheit steckt in der Streuung ${f(km.phi)}: Sie ist deutlich höher
        als bei reinem Zufall, weil die Abweichungen gegen die <b>erwartete</b> statt
        die tatsächliche Batterzahl gemessen wurden. Under ist deshalb strukturell
        sicherer als Over.</div>
      <div class="detail">Ligaschnitt ${f(km.lgRate*100,1)} Prozent Strikeouts je Batter,
        ${f(km.lgBF,1)} Batters Faced je Start · ${km.starts} Startprotokolle</div>
      </div>`;
  }

  if(moI1){
    const i=moI1.erw(heim,gast,park,hp,ap);
    const p0H=verteilung(i.muH,moI1.phiH,8)[0],p0A=verteilung(i.muA,moI1.phiA,8)[0];
    const kein=Math.min(0.999,Math.max(0.001,p0H*p0A));
    html+=`<div class="karte"><div class="kopf"><b>Erstes Inning</b>
      <div class="erw">${f(i.muH+i.muA)} <span>Runs erwartet</span></div></div>
      ${kopfTab}${zeile("NRFI · kein Run",kein)}${zeile("YRFI · mindestens ein Run",1-kein)}</tbody></table>
      <div class="detail">Beide Hälften getrennt gerechnet und multipliziert.</div></div>`;
  }
  if(moR){
    const r=moR.erw(heim,gast,park,hp,ap),ges=r.muH+r.muA;
    const bp=moR.bull;
    html+=`<div class="karte"><div class="kopf"><b>Ganzes Spiel</b>
      <div class="erw">${f(ges)} <span>Runs erwartet</span></div></div>
      ${linTab(ges,moR.phiT,[6.5,7.5,8.5,9.5,10.5,11.5])}
      <div class="detail">
        Aufteilung: ${f(r.f5)} in den ersten fünf Innings, ${f(r.spaet)} danach.<br>
        Bullpen ${heim} ${f(bp.pit[heim]||1)} · ${gast} ${f(bp.pit[gast]||1)}
        <span class="q">(unter 1,00 besser als Schnitt)</span><br>
        Heimwert der Spätphase ${f(bp.hvH)} gegen ${f(bp.hvA)} auswärts — der Abstand
        entsteht dadurch, dass das Heimteam bei Führung im neunten Inning nicht mehr
        schlägt.<br>
        Streuung ${f(moR.phiT)} aus ${moR.spiele} Endständen</div></div>`;
  }
  html+=`<p class="hinweis">Bewertung des Werfers bei Runs: ${moF5.komponenten
    ?"komponentenbasiert aus Strikeouts, Walks und Home Runs"
    :"ergebnisbasiert aus den zugelassenen Runs, bereinigt um Gegner und Park"}.
    Die Strikeout-Rechnung nutzt immer die tatsächlichen Startprotokolle und ist von
    dieser Umschaltung nicht betroffen.<br>
    Das Bullpen wird aus den Runs ab dem sechsten Inning geschätzt, bereinigt um
    Gegner und Park. Nicht abgebildet ist der Zustand des Bullpens am konkreten Tag:
    Wer gestern dreißig Würfe hatte, steht heute womöglich nicht bereit. Das ist die
    verbliebene Schwäche beim ganzen Spiel.<br>
    Ebenfalls nicht enthalten: Handedness-Splits, Wetter und Umpire.</p>`;
  ziel.innerHTML=html;
}
// Alle Maerkte einer Partie mit Wahrscheinlichkeit
function mlbMaerkte(a){
  const pa=document.getElementById("pitcherArt").value;
  const out=[];
  const moF5=mlbModell("F5",pa), moI1=mlbModell("I1",pa), moR=mlbGesamt(pa);
  const km=kModell();
  if(moF5){
    const e=moF5.erw(a.heim,a.gast,a.park,a.hp,a.ap), ges=e.muH+e.muA;
    const s=spielausgang(e.muH,e.muA,moF5.phiH,moF5.phiA,moF5.rho,14);
    out.push({id:"f5_1x2",n:`${a.heim} führt nach 5`,p:s.heim},
             {id:"f5_1x2",n:"Gleichstand nach 5",p:s.remis},
             {id:"f5_1x2",n:`${a.gast} führt nach 5`,p:s.aus});
    linienLeiter(ges,moF5.phiT,[3.5,4.5,5.5,6.5,7.5]).forEach(l=>{
      out.push({id:`f5tot:${l.L}`,n:`F5 gesamt über ${f(l.L,1)}`,p:l.over});
      out.push({id:`f5tot:${l.L}`,n:`F5 gesamt unter ${f(l.L,1)}`,p:l.under});
    });
    [[a.heim,e.muH,moF5.phiH],[a.gast,e.muA,moF5.phiA]].forEach(([nm,mu,phi])=>{
      linienLeiter(mu,phi,[0.5,1.5,2.5,3.5]).forEach(l=>{
        out.push({id:`f5team:${l.L}`,n:`${nm} F5 über ${f(l.L,1)}`,p:l.over});
        out.push({id:`f5team:${l.L}`,n:`${nm} F5 unter ${f(l.L,1)}`,p:l.under});
      });
    });
  }
  if(moI1){
    const i=moI1.erw(a.heim,a.gast,a.park,a.hp,a.ap);
    const p0H=verteilung(i.muH,moI1.phiH,8)[0], p0A=verteilung(i.muA,moI1.phiA,8)[0];
    const kein=Math.min(0.999,Math.max(0.001,p0H*p0A));
    out.push({id:"nrfi",n:"NRFI · kein Run im ersten",p:kein},
             {id:"nrfi",n:"YRFI · Run im ersten",p:1-kein});
  }
  if(km){
    [[a.hpn,a.hp,a.gast],[a.apn,a.ap,a.heim]].forEach(([nm,pid,gegner])=>{
      if(!pid) return;
      const ew=km.erwarte(pid,gegner);
      linienLeiter(ew.mu,km.phi,[3.5,4.5,5.5,6.5,7.5,8.5,9.5]).forEach(l=>{
        out.push({id:`k:${l.L}`,n:`${nm||"Starter"} über ${f(l.L,1)} K`,p:l.over});
        out.push({id:`k:${l.L}`,n:`${nm||"Starter"} unter ${f(l.L,1)} K`,p:l.under});
      });
    });
  }
  if(moR){
    const r=moR.erw(a.heim,a.gast,a.park,a.hp,a.ap), ges=r.muH+r.muA;
    linienLeiter(ges,moR.phiT,[6.5,7.5,8.5,9.5,10.5,11.5]).forEach(l=>{
      out.push({id:`tot:${l.L}`,n:`Gesamt über ${f(l.L,1)}`,p:l.over});
      out.push({id:`tot:${l.L}`,n:`Gesamt unter ${f(l.L,1)}`,p:l.under});
    });
  }
  return out;
}

function mlbScannen(){
  const ziel=document.getElementById("funde");
  if(!MLB.geladen){
    ziel.innerHTML='<div class="karte"><div class="kopf"><b>Suche</b></div>'+
      '<div class="detail">Erst die Ansetzungen laden.</div></div>';
    return;
  }
  const schwelle=Number(document.getElementById("mlbSchwelle").value)/100;
  const filter=document.getElementById("mlbEreignis").value;
  const sortierung=document.getElementById("mlbSortierung").value;
  const knopf=document.getElementById("mlbScanKnopf");
  knopf.disabled=true;
  ziel.innerHTML='<div class="karte"><div class="kopf"><b>Suche läuft</b></div>'+
    '<div class="detail">Rechnet …</div></div>';
  setTimeout(()=>{
    const jetzt=Date.now();
    const spiele=MLB.ansetzungen.filter(a=>a.ms>jetzt-3.5*3600*1000)
      .sort((a,b)=>a.ms-b.ms);
    const funde=[];
    spiele.forEach((a,i)=>{
      mlbMaerkte(a).forEach(o=>{
        if(o.p>=schwelle&&passtZumFilter(o.id,filter))
          funde.push({partie:a,idx:i,...o});
      });
    });
    if(sortierung==="p") funde.sort((x,y)=>y.p-x.p);
    else funde.sort((x,y)=>x.partie.ms-y.partie.ms||y.p-x.p);
    if(!funde.length){
      ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Suche</b></div>
        <div class="detail">Keine Treffer über ${f(schwelle*100,0)} Prozent
        in ${spiele.length} anstehenden Partien.</div></div>`;
      knopf.disabled=false; return;
    }
    const zeigen=funde.slice(0,MAX_FUNDE), nachZeit=sortierung==="zeit";
    let html=`<div class="karte"><div class="kopf"><b>Treffer ab ${f(schwelle*100,0)} %</b>
      <span class="q">${funde.length} aus ${spiele.length} Partien</span></div>`;
    let letzter="";
    zeigen.forEach(t=>{
      const tag=tagVonMs(t.partie.ms);
      if(nachZeit&&tag!==letzter){html+=`<div class="tagkopf">${tag}</div>`;letzter=tag;}
      html+=`<div class="fund" data-i="${t.idx}">
        <div class="links">
          <div class="liga">MLB · ${nachZeit?zeitVonMs(t.partie.ms):tag+" "+zeitVonMs(t.partie.ms)}</div>
          <div class="partie">${t.partie.gast} bei ${t.partie.heim}</div>
          <div class="markt">${t.n}</div></div>
        <div class="rechts"><div class="proz">${f(t.p*100,1)} %</div>
          <div class="q">fair ${f(1/t.p)}</div></div></div>`;
    });
    if(funde.length>MAX_FUNDE)
      html+=`<div class="detail">${funde.length-MAX_FUNDE} weitere ausgeblendet.</div>`;
    html+=`<div class="detail"><b>Ohne Quotenabgleich.</b> Die MLB-Schnittstelle liefert
      keine Buchmacherquoten, anders als bei Fußball. Hier steht nur, was wahrscheinlich
      ist — nicht, was sich lohnt. Halte die faire Quote gegen das Angebot deines
      Buchmachers.<br>
      Bei Strikeouts gilt weiterhin: Over verliert an jedem frühen Wechsel des Werfers,
      Under gewinnt daran. Antippen öffnet die vollständige Rechnung.</div></div>`;
    ziel.innerHTML=html;
    ziel.querySelectorAll(".fund").forEach(el=>{
      el.addEventListener("click",()=>{
        mlbZeichnen(spiele[Number(el.getAttribute("data-i"))]);
        document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
      });
    });
    knopf.disabled=false;
  },50);
}

      <div class="detail">Keine kommenden Partien.</div></div>`; return;
  }
  const pa=document.getElementById("pitcherArt").value;

    const tag=tagVonMs(a.ms);
    if(tag!==letzter){html+=`<div class="tagkopf">${tag}</div>`;letzter=tag;}

      const e=mo.erw(a.heim,a.gast,a.park,a.hp,a.ap);

    }
    if(km){
      const eH=km.erwarte(a.hp,a.gast), eA=km.erwarte(a.ap,a.heim);

    }
    html+=`<div class="spiel" data-i="${i}">
      <div class="zeit">${zeitVonMs(a.ms)} · ${a.park||""}</div>
      <div class="paar">${a.gast} bei ${a.heim}</div>
      <div class="zahlen">${zahlen}</div>
      <div class="werfer">${a.apn||"Starter offen"} gegen ${a.hpn||"Starter offen"}${ks}</div>
    </div>`;
  });
  html+=`<div class="detail">Auswärtsteam zuerst. Zeiten in deiner Ortszeit.
    K steht für die erwarteten Strikeouts, Heimstarter zuerst.</div></div>`;
  ziel.innerHTML=html;
  ziel.querySelectorAll(".spiel").forEach(el=>{
    el.addEventListener("click",()=>{
      mlbZeichnen(spiele[Number(el.getAttribute("data-i"))]);
      document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
    });
  });
}

// ======== Rückvergleich Fußball ========
function rueckvergleich(rows,m){
  const sp=rows.filter(r=>r.HomeTeam&&r.AwayTeam
    &&Number.isFinite(m.h(r))&&Number.isFinite(m.a(r))&&datum(r.Date))
    .sort((a,b)=>datum(a.Date)-datum(b.Date));
  if(sp.length<300) return null;
  const testN=Math.min(300,Math.floor(sp.length*0.3)), start=sp.length-testN;
  const bm=sp.slice(0,start).reduce((s,r)=>s+m.h(r)+m.a(r),0)/start;
  const L=Math.max(0.5,Math.round(bm)-0.5);
  const llE=[],llR=[],llB=[];
  for(let b=start;b<sp.length;b+=10){
    const bis=sp.slice(0,b),bez=datum(sp[b].Date);
    const moE=modellBauen(bis,m,"einfach",bez.getTime(),saisonIndex(bez));
    const moR=modellBauen(bis,m,"regression",bez.getTime(),saisonIndex(bez));
    if(!moE||!moR) continue;
    const pB=pOver(moE.ligaMittel,moE.phiT,L);
    for(let i=b;i<Math.min(b+10,sp.length);i++){
      const r=sp[i],ist=m.h(r)+m.a(r),y=ist>L?1:0;
      const sE=moE.staerken(r.HomeTeam,r.AwayTeam);
      const sR=moR.staerken(r.HomeTeam,r.AwayTeam);
      const v=p=>-(y*Math.log(p)+(1-y)*Math.log(1-p));
      llE.push(v(pOver(sE.muH+sE.muA,moE.phiT,L)));
      llR.push(v(pOver(sR.muH+sR.muA,moR.phiT,L)));
      llB.push(v(pB));
    }
  }
  if(llE.length<50) return null;
  const mw=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const paar=(a,b)=>{
    const d=a.map((x,i)=>x-b[i]),dm=mw(d);
    const sd=Math.sqrt(d.reduce((s,x)=>s+(x-dm)**2,0)/(d.length-1));
    return {d:dm,se:sd/Math.sqrt(d.length)};
  };
  const rVsE=paar(llR,llE),besserR=rVsE.d<0;
  const vsB=paar(besserR?llR:llE,llB);
  return {L,n:llE.length,
    sieger:Math.abs(rVsE.d)>2*rVsE.se?(besserR?"Regression":"Einfach"):"gleichwertig",
    brauchbar:vsB.d<-2*vsB.se};
}

async function ansetzungenLaden(){
  if(ANSETZUNGEN.length||FIXSTATUS) return;
  try{
    const r=await fetch("./daten/fixtures.csv");
    if(!r.ok){FIXSTATUS=`daten/fixtures.csv fehlt (Code ${r.status}).`;return;}
    const txt=await r.text();
    if(/^\s*</.test(txt)){FIXSTATUS="Die Datei enthält kein CSV.";return;}
    const rows=csvLesen(txt);
    if(!rows.length||!("HomeTeam" in rows[0])){
      FIXSTATUS="Die Datei hat keine Spalte HomeTeam.";return;}
    ANSETZUNGEN=rows;
  }catch(e){FIXSTATUS="Ansetzungsdatei konnte nicht geladen werden.";}
}
async function ligaDatenHolen(code){
  if(DATEN[code]) return DATEN[code];
  const teile=await Promise.all(SAISONS.map(async s=>{
    try{
      const r=await fetch(`./daten/${s}-${code}.csv`);
      if(!r.ok) return [];
      return csvLesen(await r.text()).filter(x=>x.HomeTeam&&x.AwayTeam);
    }catch(e){return [];}
  }));
  const alle=teile.flat();
  let i=teile.length-1;
  while(i>=0&&!teile[i].length) i--;
  DATEN[code]={alle,aktuelle:i>=0?teile[i]:[],label:i>=0?saisonText(SAISONS[i]):""};
  return DATEN[code];
}
function zugeordnet(code,d,passt){
  const bekannt=new Set((d.aktuelle.length?d.aktuelle:d.alle)
    .flatMap(r=>[r.HomeTeam,r.AwayTeam]));
  const kand=ANSETZUNGEN.filter(r=>{
    if(!r.HomeTeam||!r.AwayTeam||!datum(r.Date)) return false;
    return passt(anstoss(r),r);
  });
  let s=kand.filter(r=>r.Div===code),weg="Ligacode";
  if(!s.length){s=kand.filter(r=>bekannt.has(r.HomeTeam)&&bekannt.has(r.AwayTeam));weg="Namen";}
  s.sort((a,b)=>anstoss(a)-anstoss(b));
  return {spiele:s,weg,kand};
}
const partienFuer=(c,d)=>zugeordnet(c,d,ms=>ms>Date.now());
const laufendeFuer=(c,d)=>zugeordnet(c,d,(ms,r)=>{
  const n=Date.now();
  return hatZeit(r)&&ms<=n&&ms>n-LIVE_FENSTER*60000;});
function quote(zeile,name){
  if(!QUOTEN[name]) return null;
  for(const sp of QUOTEN[name]){const v=z(zeile[sp]); if(v>1) return v;}
  return null;
}
function maerkte(code,r,verf){
  const out=[];
  const moT=holModell(code,METRIKEN[0],verf);
  if(moT){
    const e=rechnen(moT,r.HomeTeam,r.AwayTeam,"");
    const s=spielausgang(e.muH,e.muA,moT.phiH,moT.phiA,moT.rho);
    out.push({id:"1x2",n:"Heimsieg",p:s.heim},{id:"1x2",n:"Unentschieden",p:s.remis},
             {id:"1x2",n:"Auswärtssieg",p:s.aus},
             {id:"btts",n:"Beide treffen: ja",p:s.bttsJa},
             {id:"btts",n:"Beide treffen: nein",p:s.bttsNein});
  }
  METRIKEN.forEach(m=>{
    const mo=holModell(code,m,verf);
    if(!mo) return;
    const e=rechnen(mo,r.HomeTeam,r.AwayTeam,"");
    linienLeiter(e.mu,mo.phiT,m.leiter).forEach(l=>{
      const id=`${m.id}:${l.L}`;
      out.push({id,n:`${m.name} über ${f(l.L,1)}`,p:l.over});
      out.push({id,n:`${m.name} unter ${f(l.L,1)}`,p:l.under});
    });
  });
  out.forEach(o=>{o.q=quote(r,o.n); o.v=o.q?o.p*o.q-1:null;});
  return out;
}
function passtZumFilter(id,filter){
  if(filter==="alle") return true;
  if(filter.includes(":")) return id===filter;
  return id.split(":")[0]===filter;
}

    html+=`<div class="fund" data-code="${t.code}" data-h="${t.r.HomeTeam}" data-g="${t.r.AwayTeam}">
      <div class="links">
        <div class="liga">${LIGEN[t.code]} · ${nachZeit?zeit:tag+" "+zeit}</div>

        <div class="markt">${t.n}</div></div>
      <div class="rechts"><div class="proz">${f(t.p*100,1)} %</div>
        <div class="q">fair ${f(1/t.p)}</div>
        ${t.q?(t.v>KANTE_MIN
          ?`<div class="vorteil">@ ${f(t.q)} · +${f(t.v*100,1)} %</div>`
          :`<div class="kein">@ ${f(t.q)} · ${t.v>0?"+":""}${f(t.v*100,1)} %</div>`)
          :`<div class="kein">keine Quote</div>`}
      </div></div>`;
  });
  if(funde.length>MAX_FUNDE)
    html+=`<div class="detail">${funde.length-MAX_FUNDE} weitere ausgeblendet.</div>`;
  html+=`<div class="detail"><b>Wichtig:</b> Eine hohe Wahrscheinlichkeit ist kein Vorteil.

    const s=document.getElementById(id),alt=s.value;
    s.innerHTML='<option value="">– wählen –</option>'+
      teams.map(t=>`<option${t===alt?" selected":""}>${t}</option>`).join("");
  });
}
async function ligaLaden(code){

  }

       aus Saison ${d.label} (${d.aktuelle.length} Spiele gespielt).`

// ======== Eishockey ========
const NHL_HALBWERT=350, NHL_KAPPA=6, NHL_ITER=30;
const NHL={spiele:[],ansetzungen:[],torhueter:{},geladen:false,modelle:{},otHeim:0.55};
const NHL_NAMEN={ANA:"Anaheim",BOS:"Boston",BUF:"Buffalo",CGY:"Calgary",CAR:"Carolina",
 CHI:"Chicago",COL:"Colorado",CBJ:"Columbus",DAL:"Dallas",DET:"Detroit",EDM:"Edmonton",
 FLA:"Florida",LAK:"Los Angeles",MIN:"Minnesota",MTL:"Montreal",NSH:"Nashville",
 NJD:"New Jersey",NYI:"NY Islanders",NYR:"NY Rangers",OTT:"Ottawa",PHI:"Philadelphia",
 PIT:"Pittsburgh",SJS:"San Jose",SEA:"Seattle",STL:"St. Louis",TBL:"Tampa Bay",
 TOR:"Toronto",UTA:"Utah",VAN:"Vancouver",VGK:"Vegas",WSH:"Washington",WPG:"Winnipeg"};
const nhlName=t=>NHL_NAMEN[t]||t;
const nhlTage=iso=>{const d=new Date(String(iso).slice(0,10)+"T12:00:00Z");
  return isNaN(d.getTime())?9999:Math.max(0,(JETZT-d.getTime())/86400000);};
const nhlGewicht=s=>Math.pow(0.5,nhlTage(s.datum)/NHL_HALBWERT);

const NHL_ARTEN={
  REG:{h:s=>s.regH,a:s=>s.regA,tw:true,  leiter:[3.5,4.5,5.5,6.5],name:"Tore in 60 Minuten"},
  TOR:{h:s=>s.torH,a:s=>s.torA,tw:true,  leiter:[3.5,4.5,5.5,6.5,7.5],name:"Tore gesamt"},
  SOG:{h:s=>s.sogH,a:s=>s.sogA,tw:false, leiter:[51.5,55.5,59.5,63.5,67.5],name:"Schüsse aufs Tor"},
  PIM:{h:s=>s.pimH,a:s=>s.pimA,tw:false, leiter:[7.5,9.5,11.5,13.5,15.5,17.5],name:"Strafminuten"}
};

async function nhlLaden(){
  if(NHL.geladen) return true;
  const setz=t=>{document.getElementById("nhlStatus").innerHTML=t;};
  setz("Lade …");
  try{
    const [rs,ra]=await Promise.all([
      fetch("./daten/nhl-spiele.csv"), fetch("./daten/nhl-ansetzungen.csv")]);
    if(!rs.ok){setz("daten/nhl-spiele.csv fehlt.");return false;}
    NHL.spiele=csvLesen(await rs.text()).map(r=>({
      datum:r.Datum, heim:r.Heim, gast:r.Gast,
      torH:z(r.HeimTore), torA:z(r.GastTore),
      regH:z(r.HeimReg), regA:z(r.GastReg), ende:r.Ende,
      sogH:z(r.HeimSOG), sogA:z(r.GastSOG),
      pimH:z(r.HeimPIM), pimA:z(r.GastPIM),
      twH:r.HeimTwId, twHn:r.HeimTw, twA:r.GastTwId, twAn:r.GastTw
    })).filter(s=>s.heim&&s.gast&&Number.isFinite(s.torH)&&Number.isFinite(s.torA));
    // Torhueter je Team sammeln, juengster Einsatz zuerst
    NHL.spiele.slice().sort((a,b)=>String(a.datum).localeCompare(String(b.datum)))
      .forEach(s=>{
        [[s.heim,s.twH,s.twHn],[s.gast,s.twA,s.twAn]].forEach(([t,id,nm])=>{
          if(!id) return;
          const x=NHL.torhueter[t]=NHL.torhueter[t]||{};
          x[id]=x[id]||{name:nm,n:0,letzte:""};
          x[id].n++; x[id].letzte=s.datum; x[id].name=nm||x[id].name;
        });
      });
    const ot=NHL.spiele.filter(s=>s.ende==="OT"||s.ende==="SO");
    NHL.otHeim = ot.length ? ot.filter(s=>s.torH>s.torA).length/ot.length : 0.55;
    if(ra.ok) NHL.ansetzungen=csvLesen(await ra.text()).map(r=>({
      ms:Date.parse(r.Zeit), heim:r.Heim, gast:r.Gast
    })).filter(r=>r.heim&&r.gast&&Number.isFinite(r.ms));
    NHL.geladen=true;
    setz(`${NHL.spiele.length} Spiele, ${NHL.ansetzungen.length} Ansetzungen. `+
         `Heimquote in der Verlängerung ${f(NHL.otHeim*100,1)} Prozent.`);
    return true;
  }catch(e){setz("NHL-Daten konnten nicht geladen werden.");return false;}
}

// Meistgenutzter Torhueter eines Teams in den letzten Wochen
function nhlStandardTw(team){
  const x=NHL.torhueter[team];
  if(!x) return null;
  let best=null;
  Object.entries(x).forEach(([id,d])=>{
    const pkt=d.n+ (nhlTage(d.letzte)<40 ? 100 : 0);
    if(!best||pkt>best.pkt) best={id,name:d.name,pkt};
  });
  return best;
}

function nhlBauen(art){
  const A=NHL_ARTEN[art];
  const sp=NHL.spiele.filter(s=>Number.isFinite(A.h(s))&&Number.isFinite(A.a(s)));
  if(sp.length<200) return null;
  const g=nhlGewicht;
  let gs=0,sH=0,sA=0;
  sp.forEach(s=>{const w=g(s); gs+=w; sH+=w*A.h(s); sA+=w*A.a(s);});
  const ligaH=sH/gs, ligaA=sA/gs, liga=(ligaH+ligaA)/2;
  if(!(liga>0)) return null;
  let hvH=ligaH/liga, hvA=ligaA/liga;
  const teams=[...new Set(sp.flatMap(s=>[s.heim,s.gast]))];
  const twListe=A.tw?[...new Set(sp.flatMap(s=>[s.twH,s.twA]).filter(Boolean))]:[];
  const off={},def={},tw={};
  teams.forEach(t=>{off[t]=1;def[t]=1;});
  twListe.forEach(p=>tw[p]=1);
  const K=NHL_KAPPA*liga;
  const T=p=>(A.tw&&tw[p]!==undefined)?tw[p]:1;
  for(let it=0;it<NHL_ITER;it++){
    const on={},od={},dn={},dd={};
    teams.forEach(t=>{on[t]=0;od[t]=0;dn[t]=0;dd[t]=0;});
    sp.forEach(s=>{const w=g(s);
      on[s.heim]+=w*A.h(s); od[s.heim]+=w*liga*hvH*def[s.gast]*T(s.twA);
      on[s.gast]+=w*A.a(s); od[s.gast]+=w*liga*hvA*def[s.heim]*T(s.twH);
      dn[s.gast]+=w*A.h(s); dd[s.gast]+=w*liga*hvH*off[s.heim]*T(s.twA);
      dn[s.heim]+=w*A.a(s); dd[s.heim]+=w*liga*hvA*off[s.gast]*T(s.twH);});
    teams.forEach(t=>{off[t]=(on[t]+K)/(od[t]+K); def[t]=(dn[t]+K)/(dd[t]+K);});
    let so=0,sd=0; teams.forEach(t=>{so+=off[t];sd+=def[t];});
    if(so>0&&sd>0) teams.forEach(t=>{off[t]/=so/teams.length; def[t]/=sd/teams.length;});
    if(A.tw){
      const tn={},td={};
      twListe.forEach(p=>{tn[p]=0;td[p]=0;});
      sp.forEach(s=>{const w=g(s);
        if(s.twA){tn[s.twA]+=w*A.h(s); td[s.twA]+=w*liga*hvH*off[s.heim]*def[s.gast];}
        if(s.twH){tn[s.twH]+=w*A.a(s); td[s.twH]+=w*liga*hvA*off[s.gast]*def[s.heim];}});
      twListe.forEach(p=>{tw[p]=(tn[p]+K)/(td[p]+K);});
      let st=0; twListe.forEach(p=>st+=tw[p]);
      if(st>0) twListe.forEach(p=>tw[p]/=st/twListe.length);
    }
    let nH=0,dH=0,nA=0,dA=0;
    sp.forEach(s=>{const w=g(s);
      nH+=w*A.h(s); dH+=w*liga*off[s.heim]*def[s.gast]*T(s.twA);
      nA+=w*A.a(s); dA+=w*liga*off[s.gast]*def[s.heim]*T(s.twH);});
    if(dH>0) hvH=nH/dH;
    if(dA>0) hvA=nA/dA;
  }
  const erw=(heim,gast,twHeim,twGast)=>({
    muH:liga*hvH*(off[heim]||1)*(def[gast]||1)*T(twGast),
    muA:liga*hvA*(off[gast]||1)*(def[heim]||1)*T(twHeim)});
  let n=0,rH=0,rA=0,rT=0;
  sp.forEach(s=>{
    const e=erw(s.heim,s.gast,s.twH,s.twA);
    if(!(e.muH>0)||!(e.muA>0)) return;
    n++;
    rH+=(A.h(s)-e.muH)**2/e.muH; rA+=(A.a(s)-e.muA)**2/e.muA;
    const t=e.muH+e.muA;
    rT+=((A.h(s)+A.a(s))-t)**2/t;
  });
  const mo={art,erw,off,def,tw,hvH,hvA,liga,leiter:A.leiter,name:A.name,
    phiH:n?rH/n:1,phiA:n?rA/n:1,phiT:n?rT/n:1,spiele:sp.length,rho:0,
    mittel:sp.reduce((a,s)=>a+A.h(s)+A.a(s),0)/sp.length};
  if(art==="REG") mo.rho=schaetzeRho(sp,A.h,A.a,s=>erw(s.heim,s.gast,s.twH,s.twA),g);
  return mo;
}
function nhlModell(art){
  if(NHL.modelle[art]===undefined) NHL.modelle[art]=nhlBauen(art);
  return NHL.modelle[art];
}

function nhlMaerkte(a,twH,twA){
  const out=[];
  const moR=nhlModell("REG"), moT=nhlModell("TOR");
  if(moR){
    const e=moR.erw(a.heim,a.gast,twH,twA);
    const s=spielausgang(e.muH,e.muA,moR.phiH,moR.phiA,moR.rho,14);
    out.push({id:"reg3",n:`${nhlName(a.heim)} nach 60`,p:s.heim},
             {id:"reg3",n:"Unentschieden nach 60",p:s.remis},
             {id:"reg3",n:`${nhlName(a.gast)} nach 60`,p:s.aus});
    const heimSieg=s.heim+s.remis*NHL.otHeim;
    out.push({id:"sieg",n:`${nhlName(a.heim)} gewinnt`,p:heimSieg},
             {id:"sieg",n:`${nhlName(a.gast)} gewinnt`,p:1-heimSieg});
  }
  if(moT){
    const e=moT.erw(a.heim,a.gast,twH,twA), ges=e.muH+e.muA;
    linienLeiter(ges,moT.phiT,moT.leiter).forEach(l=>{
      out.push({id:`tot:${l.L}`,n:`Tore über ${f(l.L,1)}`,p:l.over});
      out.push({id:`tot:${l.L}`,n:`Tore unter ${f(l.L,1)}`,p:l.under});
    });
    [[a.heim,e.muH,moT.phiH],[a.gast,e.muA,moT.phiA]].forEach(([t,mu,phi])=>{
      linienLeiter(mu,phi,[1.5,2.5,3.5,4.5]).forEach(l=>{
        out.push({id:"team",n:`${nhlName(t)} über ${f(l.L,1)}`,p:l.over});
        out.push({id:"team",n:`${nhlName(t)} unter ${f(l.L,1)}`,p:l.under});
      });
    });
  }
  [["SOG","sog"],["PIM","pim"]].forEach(([art,id])=>{
    const mo=nhlModell(art);
    if(!mo) return;
    const e=mo.erw(a.heim,a.gast,twH,twA), ges=e.muH+e.muA;
    linienLeiter(ges,mo.phiT,mo.leiter).forEach(l=>{
      out.push({id,n:`${mo.name} über ${f(l.L,1)}`,p:l.over});
      out.push({id,n:`${mo.name} unter ${f(l.L,1)}`,p:l.under});
    });
  });
  return out;
}

function nhlZeichnen(a,twH,twA){
  const ziel=document.getElementById("ergebnis");
  const moR=nhlModell("REG"), moT=nhlModell("TOR");
  if(!moR||!moT){ziel.innerHTML='<p class="hinweis">Zu wenige Spiele.</p>';return;}
  const sH=twH||(nhlStandardTw(a.heim)||{}).id;
  const sA=twA||(nhlStandardTw(a.gast)||{}).id;
  const zeile=(n,p)=>`<tr><td>${n}</td><td>${f(p*100,1)} %</td><td class="q">${f(1/p)}</td></tr>`;
  const kopfTab='<table><thead><tr><th>Auswahl</th><th>Wahrsch.</th><th>faire Quote</th></tr></thead><tbody>';
  const linTab=(mu,phi,leiter)=>{
    let t='<table><thead><tr><th>Linie</th><th>Over</th><th>faire Q.</th><th>Under</th><th>faire Q.</th></tr></thead><tbody>';
    linienLeiter(mu,phi,leiter).forEach(l=>{
      t+=`<tr><td>${f(l.L,1)}</td><td>${f(l.over*100,1)} %</td><td class="q">${f(1/l.over)}</td>
        <td>${f(l.under*100,1)} %</td><td class="q">${f(1/l.under)}</td></tr>`;});
    return t+"</tbody></table>";
  };
  const twWahl=(team,gewaehlt,feld)=>{
    const x=NHL.torhueter[team]||{};
    const eintraege=Object.entries(x).filter(([,d])=>d.n>=3)
      .sort((p,q)=>q[1].n-p[1].n);
    return `<select id="${feld}" style="font-size:13px;padding:5px">`+
      eintraege.map(([id,d])=>
        `<option value="${id}"${id===gewaehlt?" selected":""}>${d.name} (${d.n})</option>`
      ).join("")+"</select>";
  };
  const e=moR.erw(a.heim,a.gast,sH,sA);
  const aus=spielausgang(e.muH,e.muA,moR.phiH,moR.phiA,moR.rho,14);
  const heimSieg=aus.heim+aus.remis*NHL.otHeim;
  const et=moT.erw(a.heim,a.gast,sH,sA), ges=et.muH+et.muA;

  let html=`<div class="karte">
    <div class="kopf"><b>Torhüter</b></div>
    <div style="padding:10px 12px" class="zwei">
      <div><div class="teamzeile" style="padding:0 0 4px">${nhlName(a.heim)}</div>
        ${twWahl(a.heim,sH,"twHeimWahl")}</div>
      <div><div class="teamzeile" style="padding:0 0 4px">${nhlName(a.gast)}</div>
        ${twWahl(a.gast,sA,"twGastWahl")}</div>
    </div>
    <div class="detail">Werte ${f(moR.tw[sH]||1)} und ${f(moR.tw[sA]||1)}
      <span class="q">(unter 1,00 hält besser als der Schnitt)</span>.
      Die Vorauswahl ist der zuletzt am häufigsten eingesetzte Torhüter — die NHL
      gibt Starter nicht über die Schnittstelle bekannt. Wenn du es besser weißt,
      hier umstellen.</div></div>`;

  html+=`<div class="karte">
    <div class="kopf"><b>Spielausgang</b>
      <div class="erw">${f(e.muH,1)}:${f(e.muA,1)} <span>nach 60 Min</span></div></div>
    <div class="trenner">Dreiweg nach 60 Minuten</div>
    ${kopfTab}${zeile(nhlName(a.heim),aus.heim)}${zeile("Unentschieden",aus.remis)}
    ${zeile(nhlName(a.gast),aus.aus)}</tbody></table>
    <div class="trenner">Sieger inklusive Verlängerung</div>
    ${kopfTab}${zeile(nhlName(a.heim),heimSieg)}${zeile(nhlName(a.gast),1-heimSieg)}</tbody></table>
    <div class="detail">
      Angriff ${nhlName(a.heim)} ${f(moR.off[a.heim]||1)} · Abwehr ${f(moR.def[a.heim]||1)}<br>
      Angriff ${nhlName(a.gast)} ${f(moR.off[a.gast]||1)} · Abwehr ${f(moR.def[a.gast]||1)}<br>
      Heimvorteil ${f(moR.hvH)} · Unentschieden-Korrektur ${f(moR.rho,3)}<br>
      Der Sieger inklusive Verlängerung entsteht daraus, dass ein Unentschieden nach
      60 Minuten zu ${f(NHL.otHeim*100,1)} Prozent ans Heimteam geht — gemessen an
      allen Spielen mit Verlängerung oder Penaltyschießen.</div></div>`;

  html+=`<div class="karte">
    <div class="kopf"><b>Tore gesamt</b>
      <div class="erw">${f(ges)} <span>inklusive Verlängerung</span></div></div>
    ${linTab(ges,moT.phiT,moT.leiter)}
    <details><summary>Team-Totals</summary>
      <div class="teamzeile">${nhlName(a.heim)} · ${f(et.muH)} erwartet</div>
      ${linTab(et.muH,moT.phiH,[1.5,2.5,3.5,4.5])}
      <div class="teamzeile">${nhlName(a.gast)} · ${f(et.muA)} erwartet</div>
      ${linTab(et.muA,moT.phiA,[1.5,2.5,3.5,4.5])}
    </details>
    <div class="detail">Streuung ${f(moT.phiT)} · Ligaschnitt ${f(moT.mittel)}
      aus ${moT.spiele} Spielen. Die Überstreuung stammt vor allem aus Empty-Net-Toren:
      Ein zurückliegendes Team nimmt den Torhüter vom Eis, was in den letzten zwei
      Minuten überproportional viele Tore erzeugt.</div></div>`;

  [["SOG","Schüsse aufs Tor"],["PIM","Strafminuten"]].forEach(([art,titel])=>{
    const mo=nhlModell(art);
    if(!mo) return;
    const x=mo.erw(a.heim,a.gast,sH,sA), g2=x.muH+x.muA;
    html+=`<div class="karte"><div class="kopf"><b>${titel}</b>
      <div class="erw">${f(g2,1)} <span>erwartet</span></div></div>
      ${linTab(g2,mo.phiT,mo.leiter)}
      <details><summary>Pro Mannschaft</summary>
        <div class="teamzeile">${nhlName(a.heim)} · ${f(x.muH,1)}</div>
        ${linTab(x.muH,mo.phiH,art==="SOG"?[25.5,28.5,31.5,34.5]:[3.5,5.5,7.5,9.5])}
        <div class="teamzeile">${nhlName(a.gast)} · ${f(x.muA,1)}</div>
        ${linTab(x.muA,mo.phiA,art==="SOG"?[25.5,28.5,31.5,34.5]:[3.5,5.5,7.5,9.5])}
      </details>
      <div class="detail">Streuung ${f(mo.phiT)} · Ligaschnitt ${f(mo.mittel,1)}${
        art==="PIM"?". Strafminuten hängen stark am Schiedsrichtergespann, das hier "+
        "nicht bekannt ist — die Streuung ist entsprechend hoch.":""}</div></div>`;
  });

  html+=`<p class="hinweis">
    Der Dreiweg-Markt läuft über 60 Minuten, die Over/Under-Märkte in der Regel
    inklusive Verlängerung. Beides wird getrennt gerechnet: Bei einem Sieg nach
    Verlängerung oder Penaltyschießen fällt genau ein Tor weg, das nicht zur regulären
    Spielzeit gehört.<br>
    Nicht enthalten: Verletzungen, Rückreisen nach Auswärtsspielen, das dritte Spiel
    in vier Tagen und das Schiedsrichtergespann.</p>`;
  ziel.innerHTML=html;

  ["twHeimWahl","twGastWahl"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.addEventListener("change",()=>{
      nhlZeichnen(a, document.getElementById("twHeimWahl").value,
                     document.getElementById("twGastWahl").value);
    });
  });
}

function nhlSpieltag(){
  const ziel=document.getElementById("spieltag");
  const jetzt=Date.now();
  const spiele=NHL.ansetzungen.filter(a=>a.ms>jetzt-3*3600*1000).sort((a,b)=>a.ms-b.ms);
  if(!spiele.length){
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Ansetzungen</b></div>
      <div class="detail">Keine kommenden Partien in der Datei. Die NHL-Saison läuft
      von Oktober bis April.</div></div>`;
    return;
  }
  const moR=nhlModell("REG"), moT=nhlModell("TOR");
  let html=`<div class="karte"><div class="kopf"><b>NHL</b>
    <span class="q">${spiele.length} Partien</span></div>`;
  let letzter="";
  spiele.forEach((a,i)=>{
    const tag=tagVonMs(a.ms);
    if(tag!==letzter){html+=`<div class="tagkopf">${tag}</div>`;letzter=tag;}
    const tH=(nhlStandardTw(a.heim)||{}), tA=(nhlStandardTw(a.gast)||{});
    let zahlen="";
    if(moR&&moT){
      const e=moR.erw(a.heim,a.gast,tH.id,tA.id);
      const s=spielausgang(e.muH,e.muA,moR.phiH,moR.phiA,moR.rho,14);
      const et=moT.erw(a.heim,a.gast,tH.id,tA.id);
      zahlen=`Sieg ${f((s.heim+s.remis*NHL.otHeim)*100,0)} % · `+
             `Tore ${f(et.muH+et.muA)}`;
    }
    html+=`<div class="spiel" data-i="${i}">
      <div class="zeit">${zeitVonMs(a.ms)}</div>
      <div class="paar">${nhlName(a.gast)} bei ${nhlName(a.heim)}</div>
      <div class="zahlen">${zahlen}</div>
      <div class="werfer">${tA.name||"Torhüter offen"} gegen ${tH.name||"Torhüter offen"}</div>
    </div>`;
  });
  html+=`<div class="detail">Gastteam zuerst. Die Torhüter sind eine Annahme aus dem
    jüngsten Einsatz, keine offizielle Ansetzung.</div></div>`;
  ziel.innerHTML=html;
  ziel.querySelectorAll(".spiel").forEach(el=>{
    el.addEventListener("click",()=>{
      nhlZeichnen(spiele[Number(el.getAttribute("data-i"))]);
      document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
    });
  });
}

function nhlScannen(){
  const ziel=document.getElementById("funde");
  if(!NHL.geladen){
    ziel.innerHTML='<div class="karte"><div class="kopf"><b>Suche</b></div>'+
      '<div class="detail">Erst die Ansetzungen laden.</div></div>';
    return;
  }
  const schwelle=Number(document.getElementById("nhlSchwelle").value)/100;
  const filter=document.getElementById("nhlEreignis").value;
  const sortierung=document.getElementById("nhlSortierung").value;
  const knopf=document.getElementById("nhlScanKnopf");
  knopf.disabled=true;
  ziel.innerHTML='<div class="karte"><div class="kopf"><b>Suche läuft</b></div>'+
    '<div class="detail">Rechnet …</div></div>';
  setTimeout(()=>{
    const jetzt=Date.now();
    const spiele=NHL.ansetzungen.filter(a=>a.ms>jetzt-3*3600*1000).sort((a,b)=>a.ms-b.ms);
    const funde=[];
    spiele.forEach((a,i)=>{
      const tH=(nhlStandardTw(a.heim)||{}).id, tA=(nhlStandardTw(a.gast)||{}).id;
      nhlMaerkte(a,tH,tA).forEach(o=>{
        if(o.p>=schwelle&&passtZumFilter(o.id,filter))
          funde.push({partie:a,idx:i,...o});
      });
    });
    if(sortierung==="p") funde.sort((x,y)=>y.p-x.p);
    else funde.sort((x,y)=>x.partie.ms-y.partie.ms||y.p-x.p);
    if(!funde.length){
      ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Suche</b></div>
        <div class="detail">Keine Treffer über ${f(schwelle*100,0)} Prozent
        in ${spiele.length} anstehenden Partien.</div></div>`;
      knopf.disabled=false; return;
    }
    const zeigen=funde.slice(0,MAX_FUNDE), nachZeit=sortierung==="zeit";
    let html=`<div class="karte"><div class="kopf"><b>Treffer ab ${f(schwelle*100,0)} %</b>
      <span class="q">${funde.length} aus ${spiele.length} Partien</span></div>`;
    let letzter="";
    zeigen.forEach(t=>{
      const tag=tagVonMs(t.partie.ms);
      if(nachZeit&&tag!==letzter){html+=`<div class="tagkopf">${tag}</div>`;letzter=tag;}
      html+=`<div class="fund" data-i="${t.idx}">
        <div class="links">
          <div class="liga">NHL · ${nachZeit?zeitVonMs(t.partie.ms):tag+" "+zeitVonMs(t.partie.ms)}</div>
          <div class="partie">${nhlName(t.partie.gast)} bei ${nhlName(t.partie.heim)}</div>
          <div class="markt">${t.n}</div></div>
        <div class="rechts"><div class="proz">${f(t.p*100,1)} %</div>
          <div class="q">fair ${f(1/t.p)}</div></div></div>`;
    });
    if(funde.length>MAX_FUNDE)
      html+=`<div class="detail">${funde.length-MAX_FUNDE} weitere ausgeblendet.</div>`;
    html+=`<div class="detail"><b>Ohne Quotenabgleich.</b> Die NHL-Schnittstelle liefert
      keine Buchmacherquoten. Halte die faire Quote gegen das Angebot deines Anbieters.<br>
      Die Torhüter sind angenommen, nicht bestätigt — bei einem Wechsel verschieben
      sich vor allem die Torlinien.</div></div>`;
    ziel.innerHTML=html;
    ziel.querySelectorAll(".fund").forEach(el=>{
      el.addEventListener("click",()=>{
        nhlZeichnen(spiele[Number(el.getAttribute("data-i"))]);
        document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
      });
    });
    knopf.disabled=false;
  },50);
}
async function nhlStarten(){
  const k=document.getElementById("nhlKnopf");
  k.disabled=true;
  if(await nhlLaden()) nhlSpieltag();
  k.disabled=false;
}

// ======== Sportartenwechsel ========
function sportWechseln(){
  SPORT=document.getElementById("sportart").value;
  const zeig=(id,an)=>document.getElementById(id).style.display=an?"block":"none";
  zeig("fussballTeil",SPORT==="fussball");
  zeig("baseballTeil",SPORT==="baseball");
  zeig("nhlTeil",SPORT==="nhl");
  zeig("auswahl",SPORT==="fussball"&&!!AKTIV);
  document.getElementById("unterzeile").textContent=
    SPORT==="fussball" ? "Dreiweg · Beide treffen · Tore · Ecken · Karten · Schüsse"
    : SPORT==="baseball" ? "F5 · Dreiweg · Strikeouts · NRFI · Ganzes Spiel"
    : "Dreiweg · Tore · Schüsse · Strafminuten";
  document.getElementById("funde").innerHTML="";
  document.getElementById("vergleich").innerHTML="";
  document.getElementById("spieltag").innerHTML="";
  document.getElementById("ergebnis").innerHTML=
    SPORT==="fussball" ? "" : '<p class="hinweis">Ansetzungen laden, dann eine Partie antippen.</p>';
  if(SPORT==="baseball"&&MLB.geladen) mlbSpieltag();
  if(SPORT==="nhl"&&NHL.geladen) nhlSpieltag();
}
