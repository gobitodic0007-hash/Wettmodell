  .fund { padding:9px 12px; border-top:1px solid #e2e8f0; cursor:pointer; display:flex;

  .fund:hover { background:#f8fafc; }

  .fund .liga { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--grau); }

<script>
// ======== Einstellungen ========
const SAISONS = ["2425", "2526", "2627"];
const SAISONABSCHLAG = 0.8;
const KAPPA = 4;
const ITER = 40;
const KANTE_MIN = 0.04;
const MAX_FUNDE = 80;

const LIGEN = {
  D1:"Bundesliga", D2:"2. Bundesliga", E0:"Premier League", E1:"Championship",
  SP1:"La Liga", I1:"Serie A", F1:"Ligue 1", P1:"Liga Portugal",
  T1:"Süper Lig", B1:"Jupiler Pro League"
};

const METRIKEN = [
  { id:"tore",  name:"Tore",             halbwert:300,
    h:r=>z(r.FTHG), a:r=>z(r.FTAG), ref:false },
  { id:"ecken", name:"Ecken",            halbwert:500,
    h:r=>z(r.HC),   a:r=>z(r.AC),   ref:false },
  { id:"karten",name:"Karten",           halbwert:200,
    h:r=>z(r.HY)+z(r.HR), a:r=>z(r.AY)+z(r.AR), ref:true },
  { id:"sch",   name:"Schüsse",          halbwert:500,
    h:r=>z(r.HS),   a:r=>z(r.AS),   ref:false },
  { id:"sot",   name:"Schüsse aufs Tor", halbwert:450,
    h:r=>z(r.HST),  a:r=>z(r.AST),  ref:false }
];

const QUOTEN = {
  "Heimsieg":      ["AvgH","B365H","PSH","BWH","MaxH"],
  "Unentschieden": ["AvgD","B365D","PSD","BWD","MaxD"],
  "Auswärtssieg":  ["AvgA","B365A","PSA","BWA","MaxA"],
  "Tore über 2,5": ["Avg>2.5","B365>2.5","P>2.5","Max>2.5"],
  "Tore unter 2,5":["Avg<2.5","B365<2.5","P<2.5","Max<2.5"]
};

// ======== Hilfsmittel ========
function z(v){ if(v===undefined||v===null||String(v).trim()==="") return NaN;
               const x=Number(v); return Number.isFinite(x)?x:NaN; }
const f = (v,n=2) => Number.isFinite(v)
  ? v.toLocaleString("de-DE",{minimumFractionDigits:n,maximumFractionDigits:n}) : "–";
const saisonText = s => "20"+s.slice(0,2)+"/"+s.slice(2);
const TAGE = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const warte = () => new Promise(r=>setTimeout(r,0));

function zeileTeilen(l){
  const out=[]; let cur="", q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(c==='"'){ if(q && l[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===","&&!q){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function csvLesen(text){
  const zeilen = text.replace(/^\uFEFF/,"").replace(/\r/g,"")
                     .split("\n").filter(l=>l.trim()!=="");
  if(!zeilen.length) return [];
  const kopf = zeileTeilen(zeilen[0]).map(s=>s.trim());
  return zeilen.slice(1).map(l=>{
    const t = zeileTeilen(l), o = {};
    kopf.forEach((k,i)=>o[k]=(t[i]||"").trim());
    return o;
  });
}

function datum(s){
  if(!s) return null;
  const t=String(s).trim().split("/");
  if(t.length!==3) return null;
  let j=Number(t[2]); if(j<100) j+=2000;
  const d=new Date(Date.UTC(j, Number(t[1])-1, Number(t[0])));
  return isNaN(d.getTime()) ? null : d;
}
const saisonIndex = d => d.getUTCFullYear() - (d.getUTCMonth() < 6 ? 1 : 0);

const HEUTE = new Date();
const JETZT = HEUTE.getTime();
const SAISON_JETZT = saisonIndex(HEUTE);

function gewicht(r, halbwert, bezugMs, bezugSaison){
  const d=datum(r.Date);
  if(!d) return 0.25;
  const tage=Math.max(0,(bezugMs-d.getTime())/86400000);
  return Math.pow(0.5, tage/halbwert)
       * Math.pow(SAISONABSCHLAG, Math.max(0, bezugSaison - saisonIndex(d)));
}

function lnGamma(x){
  const g=[676.5203681218851,-1259.1392167224028,771.32342877765313,
           -176.61502916214059,12.507343278686905,-0.13857109526572012,
           9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x))-lnGamma(1-x);
  x-=1; let a=0.99999999999980993;
  for(let i=0;i<g.length;i++) a+=g[i]/(x+i+1);
  const t=x+g.length-0.5;
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function verteilung(mu, phi, max){
  const p=[];
  if(phi<=1.02){
    for(let k=0;k<=max;k++) p.push(Math.exp(-mu+k*Math.log(mu)-lnGamma(k+1)));
  } else {
    const r=mu/(phi-1);
    for(let k=0;k<=max;k++){
      p.push(Math.exp(lnGamma(k+r)-lnGamma(r)-lnGamma(k+1)
             + r*Math.log(r/(r+mu)) + k*Math.log(mu/(r+mu))));
    }
  }
  return p;
}
function pOver(mu, phi, L){
  if(!(mu>0)) return 0.5;
  const k=Math.floor(L);
  const p=verteilung(mu, phi, Math.max(k+1, Math.ceil(mu*3+30)));
  let s=0; for(let i=0;i<=k;i++) s+=p[i];
  return Math.min(0.999, Math.max(0.001, 1-s));
}
const daempfen=(v,n,k)=> (!Number.isFinite(v)||n<=0) ? 1 : 1+(v-1)*(n/(n+k));

function linienFuer(mu, phi){
  if(!(mu>0)) return [];
  const p=verteilung(mu, phi, Math.ceil(mu*3+30));
  const cdf=[]; let s=0; p.forEach(x=>{s+=x; cdf.push(s);});
  let best=0, ab=9;
  for(let k=0;k<cdf.length-1;k++){
    const d=Math.abs((1-cdf[k])-0.5);
    if(d<ab){ab=d;best=k;}
  }
  const out=[];
  for(let k=Math.max(0,best-1); k<=best+1; k++){
    const over=1-cdf[k];
    if(over<0.002||over>0.998) continue;
    out.push({ L:k+0.5, over, under:1-over, mitte:k===best });
  }
  return out;
}

function tau(x,y,lh,la,rho){
  if(x===0&&y===0) return 1-lh*la*rho;
  if(x===0&&y===1) return 1+lh*rho;
  if(x===1&&y===0) return 1+la*rho;
  if(x===1&&y===1) return 1-rho;
  return 1;
}
function schaetzeRho(sp, m, g, staerken){
  let best=0, bestLL=-Infinity;
  for(let rho=-0.20; rho<=0.2001; rho+=0.01){
    let ll=0, ok=true;
    for(const r of sp){
      const x=m.h(r), y=m.a(r);
      if(x>1||y>1) continue;
      const s=staerken(r.HomeTeam, r.AwayTeam);
      const t=tau(x,y,s.muH,s.muA,rho);
      if(!(t>0)){ ok=false; break; }
      ll += g(r)*Math.log(t);
    }
    if(ok && ll>bestLL){ bestLL=ll; best=rho; }
  }
  return best;
}

function spielausgang(muH, muA, phiH, phiA, rho){
  const N=12;
  const pH=verteilung(muH, phiH, N), pA=verteilung(muA, phiA, N);
  const g=[]; let summe=0;
  for(let x=0;x<=N;x++){
    g[x]=[];
    for(let y=0;y<=N;y++){
      const v=pH[x]*pA[y]*tau(x,y,muH,muA,rho);
      g[x][y]=Math.max(0,v); summe+=g[x][y];
    }
  }
  let heim=0, remis=0, aus=0, btts=0;
  for(let x=0;x<=N;x++) for(let y=0;y<=N;y++){
    const p=g[x][y]/summe;
    if(x>y) heim+=p; else if(x===y) remis+=p; else aus+=p;
    if(x>=1&&y>=1) btts+=p;
  }
  return { heim, remis, aus, bttsJa:btts, bttsNein:1-btts };
}

// ======== Zustand ========
const DATEN={};     // Ligacode -> {alle, aktuelle, label}
const MODELLE={};   // Ligacode:Verfahren:Kennzahl -> Modell
let ANSETZUNGEN=[], FIXSTATUS="", AKTIV="";

function rohdaten(){ return AKTIV&&DATEN[AKTIV] ? DATEN[AKTIV].alle : []; }
function aktuelle(){ return AKTIV&&DATEN[AKTIV] ? DATEN[AKTIV].aktuelle : []; }

// ======== Modell ========
function staerkenEinfach(sp, m, g, mitte, hvH, hvA){
  const T={};
  const hol=t=>T[t]=T[t]||{fuer:0,gegen:0,basF:0,basG:0,n:0,roh:0};
  sp.forEach(r=>{
    const w=g(r), eH=mitte*hvH, eA=mitte*hvA;
    const h=hol(r.HomeTeam), a=hol(r.AwayTeam);
    h.fuer+=w*m.h(r); h.basF+=w*eH; h.gegen+=w*m.a(r); h.basG+=w*eA; h.n+=w; h.roh++;
    a.fuer+=w*m.a(r); a.basF+=w*eA; a.gegen+=w*m.h(r); a.basG+=w*eH; a.n+=w; a.roh++;
  });
  const att={}, def={};
  Object.keys(T).forEach(t=>{
    const x=T[t];
    att[t]= x.basF>0 ? daempfen(x.fuer/x.basF, x.n, KAPPA) : 1;
    def[t]= x.basG>0 ? daempfen(x.gegen/x.basG, x.n, KAPPA) : 1;
  });
  return { att, def, hvH, hvA, T };
}

function staerkenRegression(sp, m, g, mitte, hvH0, hvA0){
  const T={};
  const hol=t=>T[t]=T[t]||{n:0,roh:0};
  sp.forEach(r=>{
    const w=g(r);
    hol(r.HomeTeam).n+=w; T[r.HomeTeam].roh++;
    hol(r.AwayTeam).n+=w; T[r.AwayTeam].roh++;
  });
  const teams=Object.keys(T);
  const att={}, def={};
  teams.forEach(t=>{att[t]=1; def[t]=1;});
  let hvH=hvH0, hvA=hvA0;
  const K = KAPPA*mitte;

  for(let it=0; it<ITER; it++){
    const an={}, ad={}, bn={}, bd={};
    teams.forEach(t=>{an[t]=0;ad[t]=0;bn[t]=0;bd[t]=0;});
    sp.forEach(r=>{
      const w=g(r), H=r.HomeTeam, A=r.AwayTeam;
      const yH=m.h(r), yA=m.a(r);
      an[H]+=w*yH; ad[H]+=w*mitte*hvH*def[A];
      an[A]+=w*yA; ad[A]+=w*mitte*hvA*def[H];
      bn[A]+=w*yH; bd[A]+=w*mitte*hvH*att[H];
      bn[H]+=w*yA; bd[H]+=w*mitte*hvA*att[A];
    });
    teams.forEach(t=>{
      att[t]=(an[t]+K)/(ad[t]+K);
      def[t]=(bn[t]+K)/(bd[t]+K);
    });
    let sa=0, sd=0;
    teams.forEach(t=>{sa+=att[t]; sd+=def[t];});
    const ca=sa/teams.length, cd=sd/teams.length;
    if(ca>0&&cd>0) teams.forEach(t=>{att[t]/=ca; def[t]/=cd;});

    let nH=0,dH=0,nA=0,dA=0;
    sp.forEach(r=>{
      const w=g(r);
      nH+=w*m.h(r); dH+=w*mitte*att[r.HomeTeam]*def[r.AwayTeam];
      nA+=w*m.a(r); dA+=w*mitte*att[r.AwayTeam]*def[r.HomeTeam];
    });
    if(dH>0) hvH=nH/dH;
    if(dA>0) hvA=nA/dA;
  }
  return { att, def, hvH, hvA, T };
}

function modellBauen(rows, m, verfahren, bezugMs, bezugSaison){
  const sp = rows.filter(r=>r.HomeTeam&&r.AwayTeam
             &&Number.isFinite(m.h(r))&&Number.isFinite(m.a(r)));
  if(sp.length<20) return null;
  const bm = bezugMs===undefined ? JETZT : bezugMs;
  const bs = bezugSaison===undefined ? SAISON_JETZT : bezugSaison;
  const g = r => gewicht(r, m.halbwert, bm, bs);

  let gs=0, sH=0, sA=0;
  sp.forEach(r=>{ const w=g(r); gs+=w; sH+=w*m.h(r); sA+=w*m.a(r); });
  if(!(gs>0)) return null;
  const ligaH=sH/gs, ligaA=sA/gs, mitte=(ligaH+ligaA)/2;
  if(!(mitte>0)) return null;

  const S = verfahren==="regression"
    ? staerkenRegression(sp, m, g, mitte, ligaH/mitte, ligaA/mitte)
    : staerkenEinfach(sp, m, g, mitte, ligaH/mitte, ligaA/mitte);

  const A = t => S.att[t]!==undefined ? S.att[t] : 1;
  const D = t => S.def[t]!==undefined ? S.def[t] : 1;
  const staerken=(heim,gast)=>({
    muH: mitte*S.hvH*A(heim)*D(gast),
    muA: mitte*S.hvA*A(gast)*D(heim)
  });

  let n=0, rH=0, rA=0, rT=0;
  sp.forEach(r=>{
    const s=staerken(r.HomeTeam, r.AwayTeam);
    if(!(s.muH>0)||!(s.muA>0)) return;
    n++;
    rH += (m.h(r)-s.muH)**2 / s.muH;
    rA += (m.a(r)-s.muA)**2 / s.muA;
    const t=s.muH+s.muA;
    rT += ((m.h(r)+m.a(r))-t)**2 / t;
  });

  const ligaMittel = sp.reduce((s,r)=>s+m.h(r)+m.a(r),0)/sp.length;

  const R={};
  if(m.ref) sp.forEach(r=>{
    const nm=(r.Referee||"").trim(); if(!nm) return;
    const w=g(r);
    R[nm]=R[nm]||{s:0,n:0};
    R[nm].s+=w*(m.h(r)+m.a(r)); R[nm].n+=w;
  });

  const mo = { T:S.T, staerken, angriff:A, abwehr:D, hvH:S.hvH, mitte,
               phiH:n?rH/n:1, phiA:n?rA/n:1, phiT:n?rT/n:1,
               ligaMittel, spiele:sp.length, R, rho:0 };
  if(m.id==="tore") mo.rho = schaetzeRho(sp, m, g, staerken);
  return mo;
}

function holModell(code, m, verf){
  const k=code+":"+verf+":"+m.id;
  if(MODELLE[k]===undefined) MODELLE[k]=modellBauen(DATEN[code].alle,m,verf);
  return MODELLE[k];
}

function rechnen(mo, heim, gast, ref){
  let {muH, muA} = mo.staerken(heim, gast);
  let rf=1;
  if(ref && mo.R[ref] && mo.R[ref].n>0){
    rf = daempfen((mo.R[ref].s/mo.R[ref].n)/(mo.mitte*2), mo.R[ref].n, 8);
    muH*=rf; muA*=rf;
  }
  const leer={n:0,roh:0};
  const h=mo.T[heim]||leer, a=mo.T[gast]||leer;
  return {
    muH, muA, mu:muH+muA, rf,
    angH:mo.angriff(heim), abwH:mo.abwehr(heim),
    angA:mo.angriff(gast), abwA:mo.abwehr(gast),
    gesamt: linienFuer(muH+muA, mo.phiT),
    heimL:  linienFuer(muH, mo.phiH),
    gastL:  linienFuer(muA, mo.phiA),
    hGew:h.n, aGew:a.n, hRoh:h.roh, aRoh:a.roh
  };
}

// ======== Rückvergleich ========
function rueckvergleich(rows, m){
  const sp = rows.filter(r=>r.HomeTeam&&r.AwayTeam
             &&Number.isFinite(m.h(r))&&Number.isFinite(m.a(r))&&datum(r.Date))
    .sort((a,b)=>datum(a.Date)-datum(b.Date));
  if(sp.length<300) return null;
  const testN = Math.min(300, Math.floor(sp.length*0.3));
  const start = sp.length - testN;
  const basisMittel = sp.slice(0,start).reduce((s,r)=>s+m.h(r)+m.a(r),0)/start;
  const L = Math.max(0.5, Math.round(basisMittel)-0.5);
  const llE=[], llR=[], llB=[];
  const BLOCK=10;
  for(let b=start; b<sp.length; b+=BLOCK){
    const bis=sp.slice(0,b);
    const bezug=datum(sp[b].Date);
    const moE=modellBauen(bis,m,"einfach",bezug.getTime(),saisonIndex(bezug));
    const moR=modellBauen(bis,m,"regression",bezug.getTime(),saisonIndex(bezug));
    if(!moE||!moR) continue;
    const pB=pOver(moE.ligaMittel, moE.phiT, L);
    for(let i=b; i<Math.min(b+BLOCK, sp.length); i++){
      const r=sp[i], ist=m.h(r)+m.a(r), y=ist>L?1:0;
      const sE=moE.staerken(r.HomeTeam,r.AwayTeam);
      const sR=moR.staerken(r.HomeTeam,r.AwayTeam);
      const v=(p)=>-(y*Math.log(p)+(1-y)*Math.log(1-p));
      llE.push(v(pOver(sE.muH+sE.muA,moE.phiT,L)));
      llR.push(v(pOver(sR.muH+sR.muA,moR.phiT,L)));
      llB.push(v(pB));
    }
  }
  if(llE.length<50) return null;
  const mw=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const paar=(a,b)=>{
    const d=a.map((x,i)=>x-b[i]), dm=mw(d);
    const sd=Math.sqrt(d.reduce((s,x)=>s+(x-dm)**2,0)/(d.length-1));
    return { d:dm, se:sd/Math.sqrt(d.length) };
  };
  const rVsE=paar(llR,llE);
  const besserIstR = rVsE.d < 0;
  const vsBasis=paar(besserIstR?llR:llE, llB);
  return {
    L, n:llE.length,
    sieger: Math.abs(rVsE.d) > 2*rVsE.se ? (besserIstR?"Regression":"Einfach") : "gleichwertig",
    brauchbar: vsBasis.d < -2*vsBasis.se
  };
}

function vergleichStarten(){
  const ziel=document.getElementById("vergleich");
  ziel.innerHTML='<p class="hinweis">Rechnet … das dauert einen Moment.</p>';
  setTimeout(()=>{
    let html=`<div class="karte"><div class="kopf"><b>Prüfung am Rückvergleich</b></div>
      <table><thead><tr><th>Kennzahl</th><th>Urteil</th><th>Verfahren</th></tr></thead><tbody>`;
    let irgendwas=false;
    METRIKEN.forEach(m=>{

      irgendwas=true;
      html+=`<tr>
        <td>${m.name}<br><span class="q" style="font-weight:400">Linie ${f(v.L,1)} · ${v.n} Spiele</span></td>
        <td class="${v.brauchbar?"ja":"nein"}">${v.brauchbar?"passt":"passt nicht"}</td>
        <td class="q">${v.sieger}</td></tr>`;
    });
    html+=`</tbody></table><div class="detail">
      „Passt" heißt: das Modell schlägt an dieser Linie den reinen Ligaschnitt deutlich genug,
      dass es nicht am Zufall liegt. Jede Vorhersage nutzt nur Spiele, die vorher stattfanden.</div></div>`;
    if(!irgendwas) html=`<p class="hinweis">Für die Prüfung werden mindestens 300 Spiele gebraucht.</p>`;
    ziel.innerHTML=html;
  },50);
}

// ======== Daten laden ========
async function ansetzungenLaden(){
  if(ANSETZUNGEN.length || FIXSTATUS) return;
  try{
    const r=await fetch("./daten/fixtures.csv");
    if(!r.ok){ FIXSTATUS=`Die Datei daten/fixtures.csv fehlt (Code ${r.status}).`; return; }
    const txt=await r.text();
    if(/^\s*</.test(txt)){ FIXSTATUS="Die Datei enthält kein CSV, sondern eine Webseite."; return; }
    const rows=csvLesen(txt);
    if(!rows.length || !("HomeTeam" in rows[0])){
      FIXSTATUS="Die Datei hat keine Spalte HomeTeam. Erste Spalten: "+
                Object.keys(rows[0]||{}).slice(0,6).join(", ");
      return;
    }
    ANSETZUNGEN=rows;
  }catch(e){ FIXSTATUS="Ansetzungsdatei konnte nicht geladen werden."; }
}

async function ligaDatenHolen(code){
  if(DATEN[code]) return DATEN[code];
  const teile=await Promise.all(SAISONS.map(async s=>{
    try{
      const r=await fetch(`./daten/${s}-${code}.csv`);
      if(!r.ok) return [];
      return csvLesen(await r.text()).filter(x=>x.HomeTeam&&x.AwayTeam);
    }catch(e){ return []; }
  }));
  const alle=teile.flat();
  let i=teile.length-1;
  while(i>=0 && !teile[i].length) i--;
  DATEN[code]={ alle, aktuelle: i>=0?teile[i]:[], label: i>=0?saisonText(SAISONS[i]):"" };
  return DATEN[code];
}

function partienFuer(code, d){
  const bekannt=new Set((d.aktuelle.length?d.aktuelle:d.alle)
    .flatMap(r=>[r.HomeTeam,r.AwayTeam]));
  const grenze=JETZT-36*3600*1000;
  const kand=ANSETZUNGEN.filter(r=>r.HomeTeam&&r.AwayTeam&&datum(r.Date)
    && datum(r.Date).getTime()>grenze);
  let s=kand.filter(r=>r.Div===code);
  let weg="Ligacode";
  if(!s.length){ s=kand.filter(r=>bekannt.has(r.HomeTeam)&&bekannt.has(r.AwayTeam)); weg="Namen"; }
  s.sort((a,b)=>datum(a.Date)-datum(b.Date)
                || String(a.Time||"").localeCompare(String(b.Time||"")));
  return { spiele:s, weg, kand };
}

function quote(zeile, name){
  if(!QUOTEN[name]) return null;
  for(const sp of QUOTEN[name]){
    const v=z(zeile[sp]);
    if(v>1) return v;
  }
  return null;
}

// Alle Märkte einer Partie mit Wahrscheinlichkeit und, wo vorhanden, Quote
function maerkte(code, r, verf){
  const out=[];
  const moT=holModell(code, METRIKEN[0], verf);
  if(moT){
    const e=rechnen(moT,r.HomeTeam,r.AwayTeam,"");
    const s=spielausgang(e.muH,e.muA,moT.phiH,moT.phiA,moT.rho);
    out.push({n:"Heimsieg",p:s.heim},{n:"Unentschieden",p:s.remis},
             {n:"Auswärtssieg",p:s.aus},
             {n:"Beide treffen",p:s.bttsJa},{n:"Beide treffen: nein",p:s.bttsNein});
  }
  METRIKEN.forEach(m=>{
    const mo=holModell(code, m, verf);
    if(!mo) return;
    const e=rechnen(mo,r.HomeTeam,r.AwayTeam,"");
    e.gesamt.forEach(l=>{
      out.push({n:`${m.name} über ${f(l.L,1)}`, p:l.over});
      out.push({n:`${m.name} unter ${f(l.L,1)}`, p:l.under});
    });
  });
  out.forEach(o=>{
    o.q = quote(r, o.n);
    o.v = o.q ? o.p*o.q-1 : null;
  });
  return out;
}

async function alleLigenScannen(){
  const ziel=document.getElementById("funde");
  const schwelle=Number(document.getElementById("schwelle").value)/100;
  const sortierung=document.getElementById("sortierung").value;
  const verf=document.getElementById("verfahren").value;
  const knopf=document.getElementById("scanKnopf");
  knopf.disabled=true;

  await ansetzungenLaden();
  if(!ANSETZUNGEN.length){
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Suche</b></div>
      <div class="detail">${FIXSTATUS||"Keine Ansetzungen verfügbar."}</div></div>`;
    knopf.disabled=false; return;
  }

  const codes=Object.keys(LIGEN);
  const funde=[];
  let partien=0;
  for(let i=0;i<codes.length;i++){
    const code=codes[i];
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Suche läuft</b>
      <span class="q">${i+1}/${codes.length}</span></div>
      <div class="detail">${LIGEN[code]} …</div></div>`;
    await warte();
    const d=await ligaDatenHolen(code);
    if(!d.alle.length) continue;
    const {spiele}=partienFuer(code,d);
    partien+=spiele.length;
    spiele.forEach(r=>{
      maerkte(code,r,verf).forEach(o=>{
        if(o.p>=schwelle) funde.push({code, r, ...o});
      });
    });
    await warte();
  }

  if(sortierung==="v"){
    funde.sort((a,b)=>(b.v===null?-9:b.v)-(a.v===null?-9:a.v) || b.p-a.p);
  } else {
    funde.sort((a,b)=>b.p-a.p);
  }
  const zeigen=funde.slice(0,MAX_FUNDE);

  if(!funde.length){
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Suche</b></div>
      <div class="detail">Keine Treffer über ${f(schwelle*100,0)} Prozent
      in ${partien} anstehenden Partien.</div></div>`;
    knopf.disabled=false; return;
  }

  let html=`<div class="karte"><div class="kopf"><b>Treffer ab ${f(schwelle*100,0)} %</b>
    <span class="q">${funde.length} aus ${partien} Partien</span></div>`;
  zeigen.forEach(t=>{
    const d=datum(t.r.Date);
    const tag=TAGE[d.getUTCDay()]+" "+String(d.getUTCDate()).padStart(2,"0")+"."+
              String(d.getUTCMonth()+1).padStart(2,"0")+".";
    html+=`<div class="fund" data-code="${t.code}" data-h="${t.r.HomeTeam}" data-g="${t.r.AwayTeam}">
      <div class="links">
        <div class="liga">${LIGEN[t.code]} · ${tag} ${t.r.Time||""}</div>
        <div class="partie">${t.r.HomeTeam} – ${t.r.AwayTeam}</div>
        <div class="markt">${t.n}</div>
      </div>
      <div class="rechts">
        <div class="proz">${f(t.p*100,1)} %</div>
        <div class="q">fair ${f(1/t.p)}</div>
        ${t.q ? (t.v>KANTE_MIN
            ? `<div class="vorteil">@ ${f(t.q)} · +${f(t.v*100,1)} %</div>`
            : `<div class="kein">@ ${f(t.q)} · ${t.v>0?"+":""}${f(t.v*100,1)} %</div>`)
          : `<div class="kein">keine Quote</div>`}
      </div></div>`;
  });
  if(funde.length>MAX_FUNDE)
    html+=`<div class="detail">${funde.length-MAX_FUNDE} weitere Treffer ausgeblendet.</div>`;
  html+=`<div class="detail">
    <b>Wichtig:</b> Eine hohe Wahrscheinlichkeit ist kein Vorteil. Der Buchmacher rechnet
    dieselben Favoriten aus und zahlt entsprechend wenig. Entscheidend ist die dritte Zeile
    rechts — der Vergleich mit der tatsächlichen Quote. Grün ab ${f(KANTE_MIN*100,0)} Prozent.
    Quoten liegen nur für Dreiweg und Tore über/unter 2,5 vor, und nur ab dem Zeitpunkt,
    an dem die Ansetzungsdatei sie enthält.<br>
    Antippen öffnet die Liga und die vollständige Rechnung.</div></div>`;
  ziel.innerHTML=html;

  ziel.querySelectorAll(".fund").forEach(el=>{
    el.addEventListener("click",async ()=>{
      const c=el.getAttribute("data-code");
      document.getElementById("liga").value=c;
      await ligaLaden(c);
      const sh=document.getElementById("heim"), sg=document.getElementById("gast");
      const h=el.getAttribute("data-h"), g=el.getAttribute("data-g");
      if(![...sh.options].some(o=>o.value===h)){
        document.getElementById("alleTeams").checked=true; listenFuellen();
      }
      sh.value=h; sg.value=g; zeichnen();
      document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
    });
  });
  knopf.disabled=false;
}

// ======== Spieltag ========
function spieltagZeichnen(){
  const ziel=document.getElementById("spieltag");
  const code=AKTIV;
  const verf=document.getElementById("verfahren").value;
  if(!code || !DATEN[code]){ ziel.innerHTML=""; return; }

  if(!ANSETZUNGEN.length){
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Spieltag</b></div>
      <div class="detail">${FIXSTATUS||"Ansetzungsdatei nicht geladen."}</div></div>`;
    return;
  }
  const {spiele, weg, kand}=partienFuer(code, DATEN[code]);
  if(!spiele.length){
    const divs=[...new Set(ANSETZUNGEN.map(r=>r.Div).filter(Boolean))].slice(0,25);
    ziel.innerHTML=`<div class="karte"><div class="kopf"><b>Spieltag</b></div>
      <div class="detail">Keine Partie zuordenbar.<br>
      Zeilen: <b>${ANSETZUNGEN.length}</b>, davon künftig <b>${kand.length}</b><br>
      Ligacodes in der Datei: <code>${divs.join(", ")||"keine"}</code><br>
      Gesucht: <code>${code}</code></div></div>`;
    return;
  }

  const moT=holModell(code,METRIKEN[0],verf);
  const moE=holModell(code,METRIKEN[1],verf);
  const moK=holModell(code,METRIKEN[2],verf);

  let html=`<div class="karte"><div class="kopf"><b>Spieltag</b>
    <span class="q">${spiele.length} Partien</span></div>`;
  let letzterTag="";
  spiele.forEach(r=>{
    const d=datum(r.Date);
    const tag=TAGE[d.getUTCDay()]+" "+String(d.getUTCDate()).padStart(2,"0")+"."+
              String(d.getUTCMonth()+1).padStart(2,"0")+".";
    if(tag!==letzterTag){ html+=`<div class="tagkopf">${tag}</div>`; letzterTag=tag; }
    const teile=[];
    let kante=null;
    if(moT){
      const e=rechnen(moT,r.HomeTeam,r.AwayTeam,"");
      teile.push(`Tore ${f(e.mu)}`);
      const s=spielausgang(e.muH,e.muA,moT.phiH,moT.phiA,moT.rho);
      const p25=pOver(e.mu,moT.phiT,2.5);
      [["Heimsieg",s.heim],["Unentschieden",s.remis],["Auswärtssieg",s.aus],
       ["Tore über 2,5",p25],["Tore unter 2,5",1-p25]].forEach(([nm,p])=>{
        const q=quote(r,nm); if(!q) return;
        const v=p*q-1;
        if(v>KANTE_MIN && (!kante || v>kante.v)) kante={nm,q,v};
      });
    }
    if(moE) teile.push(`Ecken ${f(rechnen(moE,r.HomeTeam,r.AwayTeam,"").mu,1)}`);
    if(moK) teile.push(`Karten ${f(rechnen(moK,r.HomeTeam,r.AwayTeam,"").mu,1)}`);
    html+=`<div class="spiel" data-h="${r.HomeTeam}" data-g="${r.AwayTeam}">
      <div class="zeit">${r.Time||""}</div>
      <div class="paar">${r.HomeTeam} – ${r.AwayTeam}</div>
      <div class="zahlen">${teile.join(" · ")}</div>
      ${kante?`<div class="kante">${kante.nm} @ ${f(kante.q)} · +${f(kante.v*100,1)} %</div>`:""}
    </div>`;
  });
  html+=`<div class="detail">Antippen öffnet die vollständige Rechnung. Zuordnung über ${weg}.
    Der grüne Hinweis erscheint ab ${f(KANTE_MIN*100,0)} Prozent Vorteil gegenüber der Quote
    aus der Ansetzungsdatei.</div></div>`;
  ziel.innerHTML=html;

  ziel.querySelectorAll(".spiel").forEach(el=>{
    el.addEventListener("click",()=>{
      const h=el.getAttribute("data-h"), g=el.getAttribute("data-g");
      const sh=document.getElementById("heim"), sg=document.getElementById("gast");
      if(![...sh.options].some(o=>o.value===h)){
        document.getElementById("alleTeams").checked=true; listenFuellen();
      }
      sh.value=h; sg.value=g; zeichnen();
      document.getElementById("ergebnis").scrollIntoView({behavior:"smooth"});
    });
  });
}

// ======== Anzeige ========
function tabelle(linien, klasse){
  if(!linien.length) return '<div class="detail">Zu wenig Erwartungswert für sinnvolle Linien.</div>';
  let h=`<table class="${klasse||""}"><thead><tr><th>Linie</th><th>Over</th><th>faire Q.</th>
    <th>Under</th><th>faire Q.</th></tr></thead><tbody>`;
  linien.forEach(l=>{
    h+=`<tr class="${l.mitte?"mitte":""}">
      <td>${f(l.L,1)}</td>
      <td>${f(l.over*100,1)} %</td><td class="q">${f(1/l.over)}</td>
      <td>${f(l.under*100,1)} %</td><td class="q">${f(1/l.under)}</td></tr>`;
  });
  return h+"</tbody></table>";
}

function zeilen(paare){
  let h='<table><thead><tr><th>Ausgang</th><th>Wahrsch.</th><th>faire Quote</th></tr></thead><tbody>';
  paare.forEach(([n,p])=>{
    h+=`<tr><td>${n}</td><td>${f(p*100,1)} %</td><td class="q">${f(1/p)}</td></tr>`;
  });
  return h+"</tbody></table>";
}

function zeichnen(){
  const heim=document.getElementById("heim").value;
  const gast=document.getElementById("gast").value;
  const ref=document.getElementById("ref").value;
  const verf=document.getElementById("verfahren").value;
  const ziel=document.getElementById("ergebnis");
  if(!AKTIV||!heim||!gast||heim===gast){
    ziel.innerHTML='<p class="hinweis">Wähle zwei verschiedene Mannschaften.</p>'; return;
  }

  let html="", basis=null;
  METRIKEN.forEach(m=>{
    const mo=holModell(AKTIV,m,verf);
    if(!mo){
      html+=`<div class="karte"><div class="detail">${m.name}: in diesen Dateien nicht enthalten.</div></div>`;
      return;
    }
    const e=rechnen(mo,heim,gast,m.ref?ref:"");
    if(!basis) basis=e;

    if(m.id==="tore"){
      const s=spielausgang(e.muH, e.muA, mo.phiH, mo.phiA, mo.rho);
      html+=`<div class="karte">
        <div class="kopf"><b>Spielausgang</b>
          <div class="erw">${f(e.muH,1)}:${f(e.muA,1)} <span>erwartet</span></div></div>
        <div class="trenner">Dreiweg</div>
        ${zeilen([[heim+" gewinnt",s.heim],["Unentschieden",s.remis],[gast+" gewinnt",s.aus]])}
        <div class="trenner">Beide treffen</div>
        ${zeilen([["Ja",s.bttsJa],["Nein",s.bttsNein]])}
        <div class="detail">
          Unentschieden-Korrektur ${f(mo.rho,3)}. Dreiweg ist der am schärfsten kalkulierte
          Markt überhaupt; ein Vorteil unter 3 Prozent ist dort praktisch nie echt.</div></div>`;
    }

    html+=`<div class="karte">
      <div class="kopf"><b>${m.name}</b>
        <div class="erw">${f(e.mu)} <span>erwartet</span></div></div>
      ${tabelle(e.gesamt)}
      <details>
        <summary>Pro Mannschaft anzeigen</summary>
        <div class="teamzeile">${heim} · ${f(e.muH)} erwartet</div>
        ${tabelle(e.heimL,"mini")}
        <div class="teamzeile">${gast} · ${f(e.muA)} erwartet</div>
        ${tabelle(e.gastL,"mini")}
      </details>
      <div class="detail">
        ${heim}: Angriff ${f(e.angH)} · Abwehr ${f(e.abwH)}<br>
        ${gast}: Angriff ${f(e.angA)} · Abwehr ${f(e.abwA)}<br>
        Heimvorteil ${f(mo.hvH)} · Halbwertszeit ${m.halbwert} Tage${e.rf!==1?` · Ref-Faktor ${f(e.rf)}`:""}<br>
        Streuung gesamt ${f(mo.phiT)}, Heim ${f(mo.phiH)}, Gast ${f(mo.phiA)} ·
        Ligaschnitt ${f(mo.ligaMittel)} aus ${mo.spiele} Spielen</div></div>`;
  });

  if(basis){
    const duenn=[];
    if(basis.hGew<5) duenn.push(`${heim} (${basis.hRoh} Spiele)`);
    if(basis.aGew<5) duenn.push(`${gast} (${basis.aRoh} Spiele)`);
    if(duenn.length){
      html=`<div class="warn"><b>Dünne Datenbasis:</b> ${duenn.join(", ")}.
        Für diese Mannschaft liegt in dieser Liga kaum Vorgeschichte vor, typisch für Aufsteiger.
        Das Modell setzt sie nahe dem Ligamittel an.</div>`+html;
    }
    html+=`<p class="hinweis">
      Verfahren: ${verf==="regression"?"Regression über alle Mannschaften gleichzeitig":"einfache Verhältnisrechnung"}.
      Gewichtete Datenbasis: ${f(basis.hGew,1)} für ${heim} aus ${basis.hRoh} tatsächlichen Spielen,
      ${f(basis.aGew,1)} für ${gast} aus ${basis.aRoh}.
      Ein Angriffs- oder Abwehrwert von 1,00 entspricht dem Ligadurchschnitt.
      Was weiterhin fehlt: Aufstellungen, Trainerwechsel und der Spielverlauf.
      Bei Ecken und Karten liegt die Buchmachermarge meist bei 6–10 statt 3–5 Prozent wie bei Toren;
      ein rechnerischer Vorteil unter 4 Prozent ist dort in der Regel Rauschen.</p>`;
  }
  ziel.innerHTML=html;
}

function listenFuellen(){
  const alle=document.getElementById("alleTeams").checked;
  const akt=aktuelle();
  const quelle = (alle || !akt.length) ? rohdaten() : akt;
  const teams=[...new Set(quelle.flatMap(r=>[r.HomeTeam,r.AwayTeam]))]
    .filter(Boolean).sort((a,b)=>a.localeCompare(b,"de"));
  ["heim","gast"].forEach(id=>{
    const s=document.getElementById(id), alt=s.value;
    s.innerHTML='<option value="">– wählen –</option>'+
      teams.map(t=>`<option${t===alt?" selected":""}>${t}</option>`).join("");
  });
}

async function ligaLaden(code){
  if(!code) return;
  document.getElementById("status").textContent="Lade …";
  await ansetzungenLaden();
  const d=await ligaDatenHolen(code);
  if(!d.alle.length){
    document.getElementById("status").innerHTML=
      "Für diese Liga wurden keine Dateien gefunden. Läuft die App noch nicht auf GitHub Pages, "+
      "nutze das Auswahlfeld darunter.";
    document.getElementById("uploadbereich").style.display="block";
    return;
  }
  AKTIV=code;
  document.getElementById("vergleich").innerHTML="";
  listenFuellen();
  const refs={};
  d.alle.forEach(r=>{const n=(r.Referee||"").trim(); if(n) refs[n]=(refs[n]||0)+1;});
  document.getElementById("ref").innerHTML='<option value="">Ligadurchschnitt</option>'+
    Object.entries(refs).filter(([,c])=>c>=3).sort((a,b)=>a[0].localeCompare(b[0],"de"))
      .map(([n,c])=>`<option value="${n}">${n} (${c})</option>`).join("");
  document.getElementById("auswahl").style.display="block";
  const anzTeams=new Set(d.aktuelle.flatMap(r=>[r.HomeTeam,r.AwayTeam])).size;
  document.getElementById("status").innerHTML = d.aktuelle.length
    ? `${d.alle.length} Spiele als Datenbasis. Teamliste: ${anzTeams} Mannschaften
       aus Saison ${d.label} (${d.aktuelle.length} Spiele gespielt).`
    : `${d.alle.length} Spiele geladen. Teamliste aus allen Saisons.`;
  document.getElementById("ergebnis").innerHTML=
    '<p class="hinweis">Wähle eine Partie aus der Liste oder zwei Mannschaften.</p>';
  spieltagZeichnen();
}

// ======== Start ========
document.getElementById("liga").innerHTML='<option value="">– wählen –</option>'+
  Object.entries(LIGEN).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
document.getElementById("liga").addEventListener("change",e=>ligaLaden(e.target.value));
["heim","gast","ref"].forEach(id=>
  document.getElementById(id).addEventListener("change",zeichnen));
document.getElementById("verfahren").addEventListener("change",()=>{ zeichnen(); spieltagZeichnen(); });
document.getElementById("alleTeams").addEventListener("change",()=>{ listenFuellen(); zeichnen(); });
document.getElementById("testKnopf").addEventListener("click",vergleichStarten);
document.getElementById("scanKnopf").addEventListener("click",alleLigenScannen);
document.getElementById("datei").addEventListener("change",async e=>{
  const texte=await Promise.all([...e.target.files].map(f=>f.text()));
  const rows=texte.flatMap(csvLesen).filter(r=>r.HomeTeam&&r.AwayTeam);
  DATEN["UPLOAD"]={alle:rows, aktuelle:[], label:""};
  AKTIV="UPLOAD";
  listenFuellen();
  document.getElementById("auswahl").style.display="block";
  document.getElementById("status").textContent=`${rows.length} Spiele geladen.`;
});
fetch(`./daten/${SAISONS[SAISONS.length-1]}-D1.csv`,{method:"HEAD"})
  .then(r=>{ if(!r.ok) throw 0; })
  .catch(()=>{ document.getElementById("uploadbereich").style.display="block"; });
</script>
