- name: Änderungen sichern
        run: |
          git config user.name "daten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A daten
          if git diff --staged --quiet; then
            echo "nichts Neues"
            exit 0
          fi
          git commit -m "Daten $(date -I)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Anlauf"
            sleep 5
          done
          echo "Push endgültig fehlgeschlagen"
          exit 1
