name: Ligadaten aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: CSVs abrufen
        run: |
          mkdir -p daten
          for SAISON in 2425 2526 2627; do
            for LIGA in D1 D2 E0 E1 SP1 I1 F1 P1 T1 B1; do
              if curl -sfL --retry 3 \
                   "https://www.football-data.co.uk/mmz4281/$SAISON/$LIGA.csv" \
                   -o /tmp/roh.csv; then
                iconv -f WINDOWS-1252 -t UTF-8
