name: Ligadaten aktualisieren

on:
  push:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 17 * * 5"
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Excel-Leser installieren
        run: pip install openpyxl

      - name: Fussball abrufen
        run: python hole_fussball.py

      - name: MLB abrufen
        run: python hole_mlb.py

      - name: Tennis abrufen
        run: python hole_tennis.py

      - name: Aenderungen sichern
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Daten aktualisiert
          file_pattern: daten/*
